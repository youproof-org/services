<p>Legyen [latex]m\gt 0[/latex] tetszőleges <strong><em>pozitív</em></strong> egész szám. Ekkor a modulo [latex]m[/latex] <strong><em>redukált maradékosztályok számát</em></strong> a [latex]\varphi(m)[/latex]-mel jelölt függvény értéke adja meg. Ezt a függvényt <strong><em>Euler-féle [latex]\varphi[/latex]-függvénynek (ejtsd: „fi”)</em></strong> nevezzük.</p>
