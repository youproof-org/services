type: proof
name: egysegelem-es-nullelem-kulonbozo-bizonyitas
remarks: []
references:
  gyuru-test:
    target:
      type: definition
      name: gyuru-test
  gyuruk-alapveto-tulajdonsagai:
    target:
      type: theorem
      name: gyuruk-alapveto-tulajdonsagai
content:
  - type: narrative
    content: |
      Tegyük fel, hogy létezik olyan gyűrű, amelyben $0=1$.
  - type: formula
    lead-in: |
      Mivel $1$ neutrális elem a szorzásra nézve, ezért tetszőleges $a$ elemre igaz az alábbi:
    content: |
      a=a\cdot 1=a\cdot \underbrace{0}_{=1}
  - type: narrative
    content: |
      Ez viszont a [gyuruk-alapveto-tulajdonsagai] 1. állítása miatt $0$-val egyenlő. Ez azt jelentené, hogy egy
      ilyen gyűrűnek valójában egyetlen eleme lenne, méghozzá a nullelem. A [gyuru-test]ban ezt a gyűrűt
      nullgyűrűnek neveztük, amelyet nem tekintünk egységelemesnek.