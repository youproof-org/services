type: proof
name: peano-szorzas-kommutativitas-bizonyitas
remarks: []
references:
  peano-szorzas:
    target:
      type: definition
      name: peano-szorzas
  peano-szorzas-kommutativitas-0-lemma:
    target:
      type: theorem
      name: peano-szorzas-kommutativitas-0-lemma
  peano-szorzas-kommutativitas-lemma:
    target:
      type: theorem
      name: peano-szorzas-kommutativitas-lemma
content:
  - type: narrative
    content: |
      Teljes indukciót alkalmazunk $b$-re vonatkozóan. Tegyük fel, hogy az állítás igaz valamilyen $b=n$
      természetes számra. Az tehát az ***indukciós feltétel***, hogy $a \cdot n=n \cdot a$.
  - type: formula
    lead-in: |
      Azt kell bizonyítanunk, hogy ebben az esetben $b=s(n)$-re is igaz lesz, azaz:
    content: |
      a \cdot \underbrace{s(n)}_{=b} = \underbrace{s(n)}_{=b} \cdot a
  - type: formula
    lead-in: |
      A [peano-szorzas] 2. pontja miatt:
    content: |
      a\cdot s(n) = (a\cdot n) + a = \ldots
  - type: formula
    lead-in: |
      Az indukciós feltétel miatt:
    content: |
      \ldots =(n\cdot a) + a= \ldots
  - type: formula
    lead-in: |
      Végül az imént bizonyított [peano-szorzas-kommutativitas-lemma] miatt:
    content: |
      \ldots = s(n) \cdot a
  - type: narrative
    content: |
      Vagyis azt kaptuk, hogy valóban $a \cdot \underbrace{s(n)}_{=b} = \underbrace{s(n)}_{=b} \cdot a$.
  - type: narrative
    content: |
      Felállítottuk tehát a dominósort, és beláttuk, hogy bármely dominó felborítása esetén a soron következő
      dominó is fel fog borulni. Az első dominót pedig már fel is borítottuk, ugyanis a
      [peano-szorzas-kommutativitas-0-lemma] alapján az állítás igaz $b=0$-ra.
  - type: narrative
    content: |
      Borul tehát az első dominó, és vele együtt a teljes dominósor, azaz minden $a$ és $b$ számra igaz, hogy
      $a\cdot b=b\cdot a$.