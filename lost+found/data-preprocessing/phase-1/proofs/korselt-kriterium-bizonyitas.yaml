content:
  - type: narrative
    content: |
      ***Elsőként*** azt mutatjuk meg, hogy ha $n$ Carmichael-szám, akkor teljesíti a fenti két kritériumot.
      Először igazoljuk, hogy $n$ négyzetmentes, ami a [negyzetmentesseg-feltetele] alapján azt jelenti, hogy nem
      létezik olyan pozitív prímosztója, amelynek a négyzetével is osztható. Tegyük fel ***indirekt***, hogy nem ez
      a helyzet, azaz $p$ egy olyan galád pozitív prímosztó, amelynek a négyzete szintén $n$ osztója. Ezt a
      [egesz-szam-p-adikus-rendje] alapján úgy is mondhatjuk, hogy az $n$ egész szám $p$-adikus rendje legalább
      $2$.
  - type: formula
    lead-in: |
      Azaz:
    content: |
      \begin{aligned}v_p(n)&=k \\ k&\geq 2\end{aligned}
  - type: formula
    lead-in: |
      Ez azt jelenti, hogy $n$ felírható az alábbi alakban, ahol $m$ tovább már nem osztható $p$-vel:
    content: |
      n=p^km
  - type: narrative
    content: |
      Mivel $p$ prím, ezért az, hogy $m$ nem osztható $p$-vel egyben azt is jelenti, hogy $p^k$ és $m$ ***relatív
      prímek***, azaz $(p^k,m)=1$.
  - type: formula
    lead-in: |
      Ekkor érvényes a ***kínai maradéktétel*** ([kinai-maradektetel]), amelynek következményeként a
      [maradekosztalygyuruk-dekompozicioja] alapján fennáll az alábbi gyűrűizomorfizmus:
    content: |
      \Z/n\Z \simeq \Z/p^k\Z \times \Z/m\Z
  - type: narrative
    content: |
      Következésképp egyértelműen létezik olyan $X$ maradékosztály a baloldali maradékosztálygyűrűben, amelyhez a
      [maradekosztalygyuruk-dekompozicioja]ben szereplő $g$ gyűrűizomorfizmus az $([1+p]_{p^k};[1]_m)$
      maradékosztálypárt rendeli hozzá a jobboldali szorzatgyűrűből. Legyen $a$ ennek az $X$ maradékosztálynak egy
      reprezentánseleme.
  - type: formula
    lead-in: |
      Ekkor tehát az említett $g$ gyűrűizomorfizmus az alábbi hozzárendelést valósítja meg:
    content: |
      [a]_n \xmapsto{g} (\underbrace{[1+p]_{p^k}}_{=[a]_{p^k}};\underbrace{[1]_m}_{=[a]_m})
  - type: formula
    lead-in: |
      Azaz fennállnak a jobboldalon szereplő maradékosztályok közötti alábbi egyenlőségek:
    content: |
      \begin{aligned}[a]_{p^k}&=[1+p]_{p^k} \\ [a]_m&=[1]_m\end{aligned}
  - type: narrative
    content: |
      A második egyenlőségből a [redukalt-maradekosztaly-feltetele] alapján következik, hogy $a$ relatív prím
      $m$-hez. Az $[a]_m=[1]_m$ maradékosztály ugyanis nyilván invertálható a $\Z/m\Z$ gyűrűben, hiszen ő ennek a
      gyűrűnek az egységeleme, amelynek inverze önmaga. Az első egyenlőségből szintén a
      [redukalt-maradekosztaly-feltetele] alapján következik, hogy $a$ pontosan akkor relatív prím $p^k$-hoz, ha
      $1+p$ is az, hiszen ők ugyanannak a modulo $p^k$ maradékosztálynak a reprezentánselemei. Ez viszont nyilván
      teljesül, hiszen $1+p$ biztosan nem osztható $p$-vel, így annak semmilyen hatványával sem. Azt kaptuk tehát,
      hogy $a$-nak nincs közös prímtényezője sem $m$-mel, sem pedig $p^k$-val is, következésképp az ő szorzatukkal,
      azaz $n$-nel sem. Az $a$ egész szám tehát relatív prím $n$-hez, azaz a [redukalt-maradekosztaly-feltetele]
      alapján $[a]_n$ egy ***redukált maradékosztály***.
  - type: narrative
    content: |
      Ugye $n$-ről most tudjuk, hogy Carmichael-szám, ami a [carmichael-szamok] alapján azt jelenti, hogy
      ***egyetlen redukált maradékosztály sem lehet Fermat-tanú***, ezért nyilván a most megkonstruált $[a]_n$ sem
      az.
  - type: formula
    lead-in: |
      Azaz a Fermat-tanúkra vonatkozó [fermat-tanu] alapján teljesül az alábbi kongruencia:
    content: |
      a^{n-1}\equiv 1\pmod n
  - type: formula
    lead-in: |
      Mivel azonban $n=p^km$, ezért nyilván teljesül a $p^k|n$ oszthatóság, és így a
      [egesz-szamok-kozotti-kongruencia-tulajdonsagai] 9. pontja alapján az alábbi kongruencia is:
    content: |
      a^{n-1}\equiv 1\pmod{p^k}
  - type: formula
    lead-in: |
      Az $a$ egész számot viszont úgy választottuk ki, hogy kongruens legyen $1+p$-vel modulo $p^k$, ezért a
      [egesz-szamok-kozotti-kongruencia-tulajdonsagai] 8. pontja alapján teljesül az alábbi kongruencia is:
    content: |
      (1+p)^{n-1}\equiv 1\pmod{p^k}
  - type: formula
    lead-in: |
      Viszont ***indirekt*** feltételezésünk szerint a $k$ kitevő legalább $2$, és így teljesül a $p^2|p^k$
      oszthatóság, és így a [egesz-szamok-kozotti-kongruencia-tulajdonsagai] 9. pontja miatt az alábbi kongruencia
      is:
    content: |
      (1+p)^{n-1}\equiv 1\pmod{p^2}
  - type: formula
    lead-in: |
      A kongruencia baloldalán tehát egy olyan $n-1$ tényezős szorzat szerepel, amelynek minden tényezője $1+p$:
    content: |
      (1+p)^{n-1}=\underbrace{(1+p)\cdot (1+p)\cdot \ldots \cdot (1+p)}_{\text{(n-1) darab}}
  - type: narrative
    content: |
      A [p-edik-hatvanyok-kulonbsegenek-p-adikus-rendje] bizonyításának gondolatmenetéhez hasonlóan a
      [gyuru-test]ban szereplő disztributivitási szabályok alapján ezt az $n-1$ darab zárójelet úgy kell
      felbontani, hogy minden zárójelből az összes lehetséges kombinációban kiválasztunk pontosan egy tagot, ezeket
      összeszorozzuk egymással, és az így kapott szorzatokat összeadjuk.
  - type: formula
    lead-in: |
      Így az alábbi tagok keletkeznek valamilyen $A_0$, $A_1$, $A_2$, ..., $A_{n-1}$ szorzó tényezőkkel attól
      függően, hogy melyik kombinációt hányféleképpen lehet előállítani az $n-1$ darab zárójelből:
    content: |
      \begin{aligned}(1+p)^{n-1} &= A_0\cdot 1^{n-1}\cdot p^0 \\ &+ A_1\cdot 1^{n-2}\cdot p^1 \\ &+ A_2\cdot
      1^{n-3}\cdot p^2 \\ &+ A_3\cdot 1^{n-4}\cdot p^3 \\ &\vdots \\ &+ A_{n-1}\cdot 1^0\cdot p^{n-1}\end{aligned}
  - type: narrative
    content: |
      Itt az $A_0$ együttható nyilván $1$ lesz, hiszen egyféleképpen lehet kiválasztani mind az $n-1$ darab
      zárójelből az $1$ tagot. Ehhez hasonló okok miatt az $A_1$ együttható $n-1$ lesz, hiszen $n-1$-féleképpen
      lehet kiválasztani az $n-1$ darab zárójelből azt az egyet, amiből a $p$ tagot vesszük az adott szorzathoz.
  - type: formula
    lead-in: |
      A zárójelek felbontása után kapott kifejezés tehát így néz ki:
    content: |
      (1+p)^{n-1} = \underbrace{1}_{=A_0}p^0 + \underbrace{(n-1)}_{=A_1}p^1 + A_2p^2 + A_3p^3 + \ldots +
      A_{n-1}p^{n-1}
  - type: narrative
    content: |
      Mivel minket ennek a kifejezésnek az értéke modulo $p^2$ érdekel minket, ezért nincs szükségünk az $A_2$,
      $A_3$, ..., $A_{n-1}$ együtthatók pontos értékére &ndash; amelyeket egyébként a binomiális tétel alapján
      lehetne kiszámítani. Vegyük ugyanis észre, hogy a 3. tagtól kezdve minden tag osztható $p^2$-tel, vagy
      másként fogalmazva $0$-val kongruens modulo $p^2$.
  - type: formula
    lead-in: |
      Így az alábbi kongruenciát kapjuk:
    content: |
      (1+p)^{n-1}\equiv 1+(n-1)p\pmod{p^2}
  - type: formula
    lead-in: |
      A baloldalon szereplő $(1+p)^{n-1}$ már megmutattuk, hogy $1$-gyel kongruens modulo $p^2$, emiatt a jobboldal
      is, azaz:
    content: |
      1\equiv 1+(n-1)p\pmod{p^2}
  - type: formula
    lead-in: |
      Mivel $n$ osztható $p$-vel (hiszen egy prímtényezőjéről van szó), így felírható $n=t\cdot p$ alakban
      valamilyen alkalmasan választott $t$ egész számmal:
    content: |
      1\equiv 1+(\underbrace{tp}_{=n}-1)p\pmod{p^2}
  - type: formula
    lead-in: |
      A jobboldalon szereplő zárójelet felbontva az alábbi adódik:
    content: |
      1\equiv 1+\underbrace{tp^2}_{\equiv 0}-p\pmod{p^2}
  - type: formula
    lead-in: |
      A középső $tp^2$ tag osztható $p^2$-tel, azaz $0$-val kongruens modulo $p^2$, így az elhagyható a
      jobboldalról:
    content: |
      1\equiv 1-p\pmod{p^2}
  - type: formula
    lead-in: |
      Ez viszont a [egesz-szamok-kozotti-kongruencia] 3. pontja alapján azt jelentené, hogy teljesül az alábbi
      oszthatóság:
    content: |
      p^2|\underbrace{1-(1-p)}_{=p}
  - type: narrative
    content: |
      Ez egyértelmű ***ellentmondás***, ami az indirekt feltételezésünkből következne, ha igaz volna. Nem igaz
      tehát, hogy $n$ osztható $p^2$-tel, vagy ugyanezen gondolatmenet alapján bármely más prímosztó négyzetével.
      Következésképp $n$ valóban ***négyzetmentes***.
  - type: narrative
    content: |
      Most a $p-1|n-1$ oszthatóságot igazoljuk. Legyen $p$ továbbra is $n$ tetszőleges pozitív prímtényezője.
  - type: formula
    lead-in: |
      Az előzőekben tehát beláttuk, hogy az $n$ egész szám $p$-adikus rendje $1$, azaz $n$ felírható az alábbi
      alakban, ahol $m$ tovább már nem osztható $p$-vel:
    content: |
      n=pm
  - type: narrative
    content: |
      Mivel $p$ prím, ezért az, hogy $m$ nem osztható $p$-vel egyben azt is jelenti, hogy $p$ és $m$ ***relatív
      prímek***, azaz $(p,m)=1$.
  - type: formula
    lead-in: |
      Ismét érvényes tehát a ***kínai maradéktétel*** ([kinai-maradektetel]), így a
      [maradekosztalygyuruk-dekompozicioja] alapján fennáll az alábbi gyűrűizomorfizmus:
    content: |
      \Z/n\Z \simeq \Z/p\Z \times \Z/m\Z
  - type: narrative
    content: |
      Tekintsük most a jobboldalon szereplő $\Z/p\Z$ gyűrű multiplikatív csoportját, azaz a $(\Z/p\Z)^{\times}$
      csoportot. Ez a $\Z/p\Z$ gyűrű invertálható elemeiből áll, amelyek épp a modulo $p$ ***redukált
      maradékosztályok***. Ezek számát a [euler-fuggveny] alapján az ***Euler-féle $\varphi$-függvény*** adja meg.
      Mivel $p$ prím, ezért ez a [euler-fuggveny-primhatvanyokra] alapján jelen esetben épp $p-1$, ami tehát a
      $(\Z/p\Z)^{\times}$ multiplikatív ***csoport rendje***.
  - type: narrative
    content: |
      A [primitiv-gyok-modulo-p] alapján a $(\Z/p\Z)^{\times}$ csoportban ***létezik primitív gyök***, hiszen $p$
      prím.
  - type: formula
    lead-in: |
      Azaz a [primitiv-gyok] utáni megjegyzés szerint létezik olyan $b$ egész szám, hogy az általa reprezentált
      $[b]_p$ redukált maradékosztály rendje épp megegyezik a csoport rendjével, azaz:
    content: |
      o([b]_p)=p-1
  - type: narrative
    content: |
      A fennálló gyűrűizomorfizmus miatt létezik olyan $X$ maradékosztály a $\Z/n\Z$ gyűrűben, amelyhez a
      [maradekosztalygyuruk-dekompozicioja]ben szereplő $g$ gyűrűizomorfizmus a $([b]_p;[1]_m)$ maradékosztálypárt
      rendeli hozzá a $\Z/p\Z \times \Z/m\Z$ szorzatgyűrűből. Legyen $a$ ennek az $X$ maradékosztálynak egy
      reprezentánseleme.
  - type: formula
    lead-in: |
      Ekkor a $g$ gyűrűizomorfizmus az alábbi hozzárendelést valósítja meg:
    content: |
      [a]_n \xmapsto{g} (\underbrace{[b]_p}_{=[a]_p};\underbrace{[1]_m}_{=[a]_m})
  - type: formula
    lead-in: |
      Azaz fennállnak a jobboldalon szereplő maradékosztályok közötti alábbi egyenlőségek:
    content: |
      \begin{aligned}[a]_p&=[b]_p \\ [a]_m&=[1]_m\end{aligned}
  - type: narrative
    content: |
      Az $a$ egész szám tehát egyrészt relatív prím $m$-hez, mivel az általa reprezentált maradékosztály nyilván
      redukált, hiszen a $\Z/m\Z$ maradékosztálygyűrű egységeleméről van szó. Másrészt relatív prím $p$-hez is,
      ugyanis a vele azonos modulo $p$ maradékosztályban lévő $b$ is az, hiszen ez a maradékosztály a
      $(\Z/p\Z)^{\times}$ multiplikatív csoport egy eleme (konkrétan az egyik primitív gyök), azaz redukált
      maradékosztály. Következésképp $a$ az $n=pm$ szorzathoz is relatív prím, azaz $(a,n)=1$, és így $[a]_n$
      szintén redukált maradékosztály a $\Z/n\Z$ gyűrűben.
  - type: formula
    lead-in: |
      Mivel azonban $n$ ugye Carmichael-szám, ezért a [carmichael-szamok] alapján $[a]_n$ biztosan nem Fermat-tanú,
      azaz teljesül az alábbi kongruencia:
    content: |
      a^{n-1}\equiv 1\pmod n
  - type: narrative
    content: |
      A [egesz-szamok-maradekosztalygyurui] alapján a maradékosztályok közötti szorzást &ndash; és így a
      hatványozást is &ndash; a reprezentánselemeken kell végrehajtani. Ezért a fenti kongruencia baloldalán épp az
      $[a]_n$ maradékosztály $n-1$-edik hatványának reprezentánseleme áll, amely hatvány tehát nem más, mint az
      $[1]_n$ maradékosztály.
  - type: formula
    lead-in: |
      Ám ekkor művelettartó tulajdonsága alapján a fenti $g$ gyűrűizomorfizmus az alábbi hozzárendelést valósítja
      meg:
    content: |
      \underbrace{[a]^{n-1}_n}_{=[1]_n} \xmapsto{g} ([b]_p;[1]_m)^{n-1}
  - type: formula
    lead-in: |
      A [gyuruk-direkt-szorzata] alapján a jobboldali szorzatgyűrűben a hatványozást komponensenként kell
      végrehajtani, így valójában az alábbi hozzárendelésről van szó:
    content: |
      [1]_n \xmapsto{g} (\underbrace{[b]^{n-1}_p}_{=[1]_p};[1]_m)
  - type: formula
    lead-in: |
      A jobboldal alapján tehát a $\Z/p\Z$ maradékosztálygyűrűben fennáll az alábbi, maradékosztályok közötti
      egyenlőség:
    content: |
      [b]^{n-1}_p= [1]_p
  - type: formula
    lead-in: |
      Minthogy $[b]_p$ a $(\Z/p\Z)^{\times}$ multiplikatív csoport egy eleme, amely csoportnak $[1]_p$ épp a
      neutrális eleme, ezért a [csoportelem-rendjere-vonatkozo-osszefuggesek] 2. pontja alapján teljesül az alábbi
      oszthatóság:
    content: |
      o([b]_p)|n-1
  - type: narrative
    content: |
      Azt azonban már korábban láttuk, hogy $[b]_p$ rendje épp $p-1$, azaz valóban ***teljesül a $p-1|n-1$
      oszthatóság*** $n$ bármely pozitív $p$ prímtényezőjére.
  - type: narrative
    content: |
      ***Végezetül*** megmutatjuk, hogy ha egy összetett számra teljesülnek a tételben szereplő kritériumok, akkor
      ő szükségképpen Carmichael-szám. Legyen ezért $n$ tetszőleges ***összetett*** szám, amely
      ***négyzetmentes***, és tegyük fel, hogy bármely pozitív $p$ prímtényezőjére teljesül a $p-1|n-1$
      oszthatóság. Válasszunk egy tetszőleges $a$ egész számot, amely relatív prím $n$-hez. Mivel $p$ az $n$ egy
      prímtényezője, ezért $a$ relatív prím $p$-hez is.
  - type: formula
    lead-in: |
      Ekkor a ***kis Fermat-tétel*** alapján ([kis-fermat-tetel]) teljesül az alábbi kongruencia:
    content: |
      a^{p-1}\equiv 1\pmod p
  - type: formula
    lead-in: |
      A feltételünk szerint azonban most fennáll a $p-1|n-1$ oszthatóság, azaz létezik olyan $t$ egész szám,
      amelyre teljesül az alábbi:
    content: |
      (p-1)t=n-1
  - type: formula
    lead-in: |
      A fenti kongruencia mindkét oldalát a $t$-edik hatványra emelve ezt kapjuk:
    content: |
      (a^{p-1})^t\equiv 1^t\pmod p
  - type: formula
    lead-in: |
      A hatványozás azonosságairól szóló [hatvanyozas-azonossagai] 2. pontja alapján tehát:
    content: |
      a^{\overbrace{n-1}^{=(p-1)t}}\equiv 1\pmod p
  - type: formula
    lead-in: |
      Ez a [egesz-szamok-kozotti-kongruencia] 3. pontja alapján azt jelenti, hogy teljesül az alábbi oszthatóság:
    content: |
      p|a^{n-1}-1
  - type: narrative
    content: |
      Azt kaptuk tehát, hogy az $n$ egész szám tetszőleges pozitív prímtényezőjére igaz, hogy ő az $a^{n-1}-1$
      egész számnak is prímtényezője.
  - type: formula
    lead-in: |
      Tekintsük most $n$ egy olyan prímtényezős felbontását, amelyben minden tényező pozitív (ilyen nyilván
      létezik, hiszen maga $n$ is pozitív):
    content: |
      n=p_1\cdot p_2\cdot p_3\cdot \ldots \cdot p_r
  - type: narrative
    content: |
      A fenti gondolatmenet alapján eszerint a $p_1$, $p_2$, ..., $p_r$ prímek mind az $a^{n-1}-1$ egész szám
      pozitív prímtényezői. Minthogy $n$-ről azt mondtuk, hogy ***négyzetmentes***, ezért ezek a prímtényezők
      páronként különbözőek.
  - type: formula
    lead-in: |
      Emiatt végülis az ő szorzatuk &ndash; azaz maga $n$ &ndash; szintén osztója az $a^{n-1}-1$ egész számnak:
    content: |
      \underbrace{p_1\cdot p_2\cdot p_3\cdot \ldots \cdot p_r}_{=n}|a^{n-1}-1
  - type: formula
    lead-in: |
      Ez a [egesz-szamok-kozotti-kongruencia] 3. pontja alapján azt jelenti, hogy teljesül az alábbi kongruencia:
    content: |
      a^{n-1}\equiv 1\pmod n
  - type: narrative
    content: |
      Így tehát semmilyen tetszőlegesen választott $[a]_n$ redukált maradékosztály ***nem lehet Fermat-tanú***,
      azaz a [carmichael-szamok] alapján az $n$ összetett szám valóban Carmichael-szám.