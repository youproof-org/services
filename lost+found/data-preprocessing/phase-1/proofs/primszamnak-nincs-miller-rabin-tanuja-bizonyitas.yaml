type: proof
name: primszamnak-nincs-miller-rabin-tanuja-bizonyitas
remarks: []
references:
  egesz-szamok-kozotti-kongruencia:
    target:
      type: theorem
      name: egesz-szamok-kozotti-kongruencia
  kis-fermat-tetel:
    target:
      type: theorem
      name: kis-fermat-tetel
  miller-rabin-szorzat:
    target:
      type: theorem
      name: miller-rabin-szorzat
  miller-rabin-tanu:
    target:
      type: definition
      name: miller-rabin-tanu
  primtulajdonsagu-elem:
    target:
      type: definition
      name: primtulajdonsagu-elem
content:
  - type: narrative
    content: |
      Legyen $n\gt 1$ egy tetszőleges páratlan prímszám, továbbá legyen adva egy tetszőleges $[a]_n$ redukált
      maradékosztály.
  - type: formula
    lead-in: |
      Képezzük azt az $e\geq 1$ kitevőt és $k\geq 1$ páratlan számot, amelyekre teljesülnek az alábbiak:
    content: |
      n-1=2^e\cdot k
  - type: formula
    lead-in: |
      Azt kell igazolni, hogy $[a]_n$ nem lehet Miller-Rabin-tanú, azaz az alábbi kongruenciák közül legalább az
      egyiknek teljesülnie kell:
    content: |
      \begin{aligned}a^k&\equiv +1\pmod n \\ a^k&\equiv -1 \\ a^{2k}&\equiv -1\pmod n \\ a^{4k}&\equiv -1\pmod n \\
      &\vdots \\ a^{2^{e-1}\cdot k}&\equiv -1\pmod n\end{aligned}
  - type: formula
    lead-in: |
      Mivel $n$ prím, továbbá $(a,n)=1$ &ndash; hiszen $[a]_n$ egy redukált maradékosztály &ndash;, ezért a ***kis
      Fermat-tétel*** ([kis-fermat-tetel]) miatt teljesül rá az alábbi kongruencia:
    content: |
      a^{\overbrace{2^e\cdot k}^{=n-1}}\equiv 1\pmod n
  - type: formula
    lead-in: |
      Ez a [egesz-szamok-kozotti-kongruencia] 3. pontja alapján azt jelenti, hogy teljesül az alábbi oszthatóság:
    content: |
      n|a^{2^e\cdot k}-1
  - type: formula
    lead-in: |
      Az oszthatóságban szereplő jobboldali kifejezést a [miller-rabin-szorzat] alapján szorzatba fejthetjük:
    content: |
      n|(a^k-1)\cdot (a^k+1)\cdot (a^{2k}+1)\cdot (a^{4k}+1)\cdot \ldots \cdot (a^{2^{e-1}k}+1)
  - type: narrative
    content: |
      Mivel $n$ ***prím***, ezért a [primtulajdonsagu-elem] utáni megjegyzés szerint legalább az egyik jobboldali
      tényezőnek osztója kell legyen.
  - type: formula
    lead-in: |
      Azaz az alábbi oszthatóságok közül legalább az egyiknek teljesülnie kell:
    content: |
      \begin{aligned}n&|a^k-1 \\ n&|a^k+1 \\ n&|a^{2k}+1 \\ n&|a^{4k}+1 \\ &\vdots \\ n&|a^{2^{e-1}k}+1
      \end{aligned}
  - type: formula
    lead-in: |
      A [egesz-szamok-kozotti-kongruencia] 3. pontja alapján ez tehát azt jelenti, hogy ***legalább az egyik***
      kongruenciának teljesülnie kell az alábbiak közül:
    content: |
      \begin{aligned}a^k\equiv +1\pmod n \\ a^k\equiv -1\pmod n \\ a^{2k}\equiv -1\pmod n \\ a^{4k}\equiv -1\pmod n
      \\ &\vdots \\ a^{2^{e-1}k}\equiv -1\pmod n \end{aligned}
  - type: narrative
    content: |
      Ez viszont a [miller-rabin-tanu] szerint épp azt jelenti, hogy az $[a]_n$ maradékosztály ***nem
      Miller-Rabin-tanú***.