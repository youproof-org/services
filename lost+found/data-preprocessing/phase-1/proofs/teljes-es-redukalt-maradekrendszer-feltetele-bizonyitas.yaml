type: proof
name: teljes-es-redukalt-maradekrendszer-feltetele-bizonyitas
remarks: []
references:
  egesz-szamok-maradekosztalyai:
    target:
      type: theorem
      name: egesz-szamok-maradekosztalyai
  euler-fuggveny:
    target:
      type: definition
