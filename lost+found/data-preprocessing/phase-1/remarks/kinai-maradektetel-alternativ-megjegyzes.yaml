    target:
      type: theorem
      name: bezout-lemma-euklideszi-gyurukben
  linearis-diofantoszi-egyenlet-osszes-megoldasa:
    target:
      type: theorem
      name: linearis-diofantoszi-egyenlet-osszes-megoldasa
  linearis-kongruenciak-es-linearis-diofantoszi-egyenletek-megoldhatosaga:
    target:
      type: theorem
      name: linearis-kongruenciak-es-linearis-diofantoszi-egyenletek-megoldhatosaga
  linearis-kongruenciak-megoldasai-es-megoldasszama:
    target:
      type: theorem
      name: linearis-kongruenciak-megoldasai-es-megoldasszama
content:
  - type: narrative
    content: |
      A tételben szereplő $p\cdot x_1\equiv 1\pmod q$ és $q\cdot x_2\equiv 1\pmod p$ kongruenciáknak a
      [linearis-kongruenciak-es-linearis-diofantoszi-egyenletek-megoldhatosaga] alapján létezik megoldása, hiszen
      $p$ és $q$ a tétel szövege alapján relatív prímek. Ugyanezen okból a
      [linearis-kongruenciak-megoldasai-es-megoldasszama] 1. pontja miatt a megoldás mindkét kongruencia esetén
      egy-egy maradékosztály lesz.
  - type: formula
    lead-in: |
      Ezek megtalálásához a [linearis-kongruenciak-es-linearis-diofantoszi-egyenletek-megoldhatosaga] alapján az
      alábbi ***lineáris diofantoszi egyenleteket*** kell megoldani:
    content: |
      \begin{aligned}px_1+qy_1&=1 \\ qx_2+py_2&=1\end{aligned}
  - type: narrative
    content: |
      Ezeket a [linearis-diofantoszi-egyenlet-osszes-megoldasa] 1. pontja alapján a
      [bezout-lemma-euklideszi-gyurukben] bizonyításában ismertetett ***kibővített euklidészi algoritmus***
      segítségével tehetjük meg.
  - type: narrative
    content: |
      Azaz valóban egy eljárást kaptunk az $A\cap B$ maradékosztály egy reprezentánselemének meghatározásához.