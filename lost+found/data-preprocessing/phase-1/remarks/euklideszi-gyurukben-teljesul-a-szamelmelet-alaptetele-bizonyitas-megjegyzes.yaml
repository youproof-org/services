type: remark
name: euklideszi-gyurukben-teljesul-a-szamelmelet-alaptetele-bizonyitas-megjegyzes
content:
  - type: narrative
    content: |
      A bizonyításban azt állítottuk, hogy az üres halmaz minden elemének létezik prímtényezős felbontása. Ez
      elsőre ellentmondásnak tűnik, azonban furcsamód nem az. Tegyük fel ugyanis indirekt, hogy az állítás nem
      igaz, azaz az üres halmazban nem minden elemnek létezik felbontása. Ez másként fogalmazva épp azt jelenti,
      hogy létezik olyan elem az üres halmazban, amelynek nem létezik felbontása. Ez viszont ellentmondás, ugyanis
      az üres halmaznak egyáltalán nincs eleme.
  - type: narrative
    content: |
      Az ilyen érvelés egy tipikus esete annak a furcsa jelenségnek, miszerint bármilyen, az üres halmaz elemeire
      tett univerzális állítás igaz. Például a "minden ismert egyszarvú fekete" és a "minden ismert egyszarvú
      fehér" mondatok egyaránt igaz állítások, tekintve, hogy mindkettő az üres halmaz elemeiről, nevezetesen az
      "ismert egyszarvúakról" tesz valamilyen univerzális kijelentést. A külföldi matematikai logikai szakirodalom
      "vacuous truth"-nak hívja az ilyesfajta kijelentéseket.