prologue:
  - type: narrative
    content: |
      Első körben azt fogjuk megvizsgálni, hogy az egész számok $\Z$ gyűrűjén pontosan mit jelent a
      [ideal-szerinti-kongruencia]ban bevezetett, meglehetősen absztrakt ***ideál szerinti kongruencia***. Ehhez
      előszöris meg kell találnunk e gyűrű ***ideáljait***. A [euklideszi-gyuru-foidealgyuru] alapján minden
      euklidészi gyűrű &ndash; és így speciálisan maga $\Z$ is &ndash; ***főideálgyűrű***.
  - type: narrative
    content: |
      Ez a [foidealgyuruk] szerint azt jelenti, hogy $\Z$ összes ideálja egy-egy elemmel generálható. Ha tehát
      kiválasztunk egy tetszőleges $m$ egész számot, akkor az $m$-et tartalmazó legszűkebb $\Z$-beli ideált úgy
      kapjuk meg, hogy képezzük $m$ összes többszörösét. Ezt a halmazt a [vegesen-generalt-idealok-es-foidealok]
      alapján az $m$ egész szám által generált ***főideálnak*** nevezzük, és $(m)$-mel jelöljük.
  - type: formula
    lead-in: |
      Ha például $m=3$, akkor az ehhez tartozó főideál &ndash; az előző részben tanult halmazjelölésekkel &ndash;
      az alábbi halmaz lesz:
    content: |
      (3)=\{\ldots;-9;-6;-3;0;3;6;9;\ldots\}
  - type: narrative
    content: |
      Ezután a [ideal-szerinti-kongruencia]t szó szerint követve már könnyedén megmondhatjuk bármely $a$ és $b$
      egész számokról, hogy vajon kongruensek-e a $(3)$ főideál szerint vagy nem. Az említett definíció szerint ez
      a kongruencia pontosan akkor teljesül, ha az $a-b$ különbség eleme ennek az ideálnak, azaz &ndash; szintén az
      előző részben tanult halmazjelölésekkel &ndash; $(a-b)\in (3)$. Például a $13$ és a $7$ között fennál a $(3)$
      főideál szerinti kongruencia, mivel $13-7=6\in (3)$. Ezzel szemben a $18$ és a $13$ egész számok
      inkongruensek a $(3)$ főideál szerint, hiszen $18-13=5\ otin (3)$.
  - type: narrative
    content: |
      Ez persze nem túl intuitív, és nem is ez volt a kongruencia fogalmának eredeti jelentése. Ezt a relációt Carl
      Friedrich Gauss német matematikus vezette be a Disquisitiones Arithmeticae című művében, és kizárólag az
      egész számok között volt értelmezve. Ehhez képest az ***ideál*** fogalmának alapjait Ernst Kummer, szintén
      német matematikus fektette le jó 50 évvel később, amikor a mintegy 350 évig megoldatlan Nagy Fermat-sejtést
      akarta bizonyítani. Ez ugyan végül nem sikerült neki, de jelentős előrehaladást sikerült elérnie, és
      felfedezései a 20. században kifejlesztett számelméleti eszközöket is megalapozták.
  - type: narrative
    content: |
      Először tehát azt fogjuk megvizsgálni, hogy mi volt a ***kongruencia fogalmának eredeti jelentése***, és
      hogyan kapcsolódik ez a [ideal-szerinti-kongruencia]ban bevezetett ***ideál szerinti kongruenciákhoz***.
