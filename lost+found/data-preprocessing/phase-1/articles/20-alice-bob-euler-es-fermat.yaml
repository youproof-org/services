epilogue:
  - type: narrative
    content: |
      Ebben a részben tehát megvizsgáltuk, hogy a 18. részben bevezetett kongruencia fogalma mit jelent az egész
      számok $\Z$ gyűrűjére vonatkoztatva. Megmutattuk, hogy a kongruenciákkal nagyjából ugyanúgy kell számolni,
      mint a hagyományos egyenletekkel, de azért bizonyos esetekben vigyázni kell. Ezután megvizsgáltuk, hogy
      hogyan néznek ki az egész számok maradékosztályai és maradékosztálygyűrűi, és megismerkedtünk az Euler-féle
      $\varphi$-függvénnyel, amely a modulo $m$ redukált maradékosztályok számát adja meg. A lineáris kongruenciák
      megoldhatóságának feltételei kapcsán erre a függvényre adtunk egy alternatív definíciót is. Végül
      megismerkedtünk az RSA-eljárás alapját képező Euler-Fermat tétellel.
  - type: narrative
    content: |
      A következő részekben kibővítjük a 17. részben megismert euklidészi algoritmust, amely így már alkalmas lesz
      a most tanult lineáris kongruenciák megoldására is. Megvizsgáljuk továbbá, hogy hogyan lehet kiszámítani az
      Euler-féle $\varphi$-függvény értékét egy adott számra annak prímtényezőinek ismeretében. Így már minden
      számelméleti ismeret rendelkezésre áll az RSA-eljárás részleteinek bemutatásához. Végül rátérünk arra a
      kérdésre, hogy hogyan lehet az RSA biztonságához szükséges óriási &ndash; a gyakorlatban többszázjegyű
      &ndash; prímszámokat találni.