abstract:
  - type: narrative
    content: |
      A 18. részben bevezettük a "gyűrűhomomorfizmus" és az ehhez szorosan kapcsolódó "gyűrűhomomorfizmus szerinti
      kongruencia" fogalmát. Megmutattuk ugyanakkor, hogy egy ilyen reláció nem függ egy konkrét
      gyűrűhomomorfizmustól, hanem annak csak a "magjától". Ezeket a részhalmazokat "ideáloknak" neveztük el,
      definiáltuk az "ideál szerinti kongruenciát", és igazoltuk, hogy ez a kétféle kongruencia-fogalom valójában
      egy és ugyanaz. Ennek során ismerkedtünk meg az úgynevezett "maradékosztálygyűrű" vagy "faktorgyűrű"
      fogalmával, amely ebben a részben kap fontos szerepet. Végül az előző részben az ideálok segítségével
      megadtunk egy szükséges és elégséges feltételt a számelmélet alaptételének teljesülésére, valamint
      megismerkedtünk a "főideálgyűrűk" fogalmával.
  - type: narrative
    content: |
      De vajon mit jelent a kongruencia és a maradékosztálygyűrű fogalma az egész számok esetén? Mik azok a teljes
      és redukált maradékrendszerek, és milyen tulajdonságaik vannak? Mit mér az Euler-féle $\varphi$-függvény? Mit
      nevezünk lineáris kongruenciának és mikor létezik megoldása? Mit állít az Euler-Fermat tétel és miért olyan
      fontos? Ebben a részben erről lesz szó...
