epilogue:
  - type: narrative
    content: |
      Ebben a részben tehát ízelítőt mutattunk abból, hogy hogyan történik egy matematikai elmélet felépítése. Egy
      ilyen építménynek az alapja mindig egy úgynevezett axiómarendszer, amely néhány olyan állításból áll,
      amelyeket igaznak fogadunk el. Ezekből kiindulva aztán újabb fogalmak definiálhatók, és újabb állítások
      eredeztethetők a matematikai logika szigorú szabályai szerint. Példaként bemutattuk a Peano-axiómarendszert,
      amely mindössze 4 állítást fogalmaz meg. Ebből következik minden, amit a természetes számokkal kapcsolatban
      jelenleg tudunk, de az is, amit majd csak az utókor fog felfedezni a jövőben. A Peano-axiómák segítségével
      bevezettünk egy műveletet is a természetes számok között, amelyet összeadásnak neveztünk el. Végül a teljes
      indukciós bizonyításra mutattunk példákat, amelyekkel bizonyítottuk, hogy az összeadás jól megszokott
      tulajdonságai valóban teljesülnek, mint az axiómák logikai következményei.
  - type: narrative
    content: |
      A következő részben egy másik műveletet is be fogunk vezetni, amelyet szorzásnak fogunk nevezni. Erre a
      műveletre is hasonló tulajdonságokat fogunk bizonyítani az axiómákból, valamint megmutatunk egy nagyon fontos
      kapcsolatot a két művelet között. Ezután végre rátérhetünk azokra a kérdésekre, amelyek lehetővé teszik az
      előző részekben bemutatott kriptográfiai primitívek működését, és amelyek nélkül ma nem létezne információs
      társadalom.