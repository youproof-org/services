abstract:
  - type: narrative
    content: |
      Az előző részben kibővítettük csoportelméleti eszköztárunkat, és megismerkedtünk a csoporthomomorfizmusok, a
      normálosztók és a faktorcsoportok fogalmával. Ezek tárgyalása során fontos párhuzamokra világítottunk rá,
      hiszen a 18. részben gyakorlatilag pontosan ugyanezt az utat jártuk végig a gyűrűhomomorfizmusok, az ideálok
      és a faktorgyűrűk (vagy maradékosztálygyűrűk) ismertetésekor. Kitértünk továbbá az úgynevezett ciklikus
      csoportokra, és teljes mértékben feltártuk ezek szerkezetét. Ebben a részben a megismert csoportelméleti
      eszközök egy fontos alkalmazását mutatjuk be. Lényegesen javítani fogunk ugyanis a Miller-Rabin-tanúk számára
      vonatkozó eddigi alsó becslésünkön, amelyet a 24. részben adtunk meg.
  - type: narrative
    content: |
      De vajon mit nevezünk primitív gyöknek, és mi köze ennek a Diffie-Hellman kulcscsere protokollhoz? Milyen
      esetekben ciklikus egy maradékosztálygyűrű multiplikatív csoportja? Mit állít az úgynevezett
      Korselt-kritérium a Carmichael-számokról? Hogyan lehet igazolni, hogy a redukált maradékosztályoknak legalább
      a háromnegyede Miller-Rabin-tanú? Mi a következménye, ha az RSA kulcsok generálásához véletlenül prímek
      helyett Carmichael-számokat használunk? Ebben a részben erről lesz szó...
