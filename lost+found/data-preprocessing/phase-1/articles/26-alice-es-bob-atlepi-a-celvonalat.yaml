prologue:
  - type: narrative
    content: |
      Az előző rész végén igazoltuk, hogy az egész számok $\Z$ gyűrűjének, valamint tetszőleges $m\geq 0$ esetén a
      $\Z/m\Z$ maradékosztálygyűrűnek az ***additív csoportja*** ciklikus, továbbá, hogy ezeken kívül &ndash;
      izomorfiától eltekintve &ndash; nem is létezik más ciklikus csoport. Előbbit az $1$ egész szám, utóbbit pedig
      az $[1]_m$ maradékosztály generálja. Nyilván, hiszen ezeknek vagy ellentettjeiknek az önmagukkal való
      valahányszori összeadása előállítja az adott gyűrű minden elemét.
  - type: narrative
    content: |
      Felmerült azonban a kérdés, hogy vajon mi a helyzet ugyanezen gyűrűk ***multiplikatív csoportjával***. A $\Z$
      gyűrű esetén ebben a tekintetben egyszerű a dolgunk. A [gyuru-additiv-es-multiplikativ-csoportja] utáni
      megjegyzés alapján ugyanis egy kommutatív, egységelemes gyűrű multiplikatív csoportja pontosan az egységekből
      áll. Ezek a $\Z$ gyűrűben a $+1$ és $-1$ egész számok lesznek. Az Olvasó a [csoport] és a
      [ciklikus-csoportok] alapján könnyedén leellenőrizheti, hogy ez a kételemű halmaz egy ciklikus csoportot
      alkot az egészek közötti szorzással, mint művelettel. A generátorelem ebben az esetben a $-1$ egész szám,
      hiszen ennek hatványai kiadják a teljes csoportot. Ezzel szemben a $+1$ egész szám ***nem generátorelem***,
      mivel az csak az egyelemű triviális részcsoportot generálja &ndash; azt, amelyikben csak a $+1$ szerepel.
  - type: narrative
    content: |
      Mármost ha a $\Z^{\times}$ kételemű multiplikatív csoport ***ciklikus***, akkor a
      [ciklikus-csoportok-strukturatetele] alapján izomorf a $\Z^+$ vagy a $(\Z/m\Z)^+$ additív csoportok
      valamelyikével. A $\Z^+$ csoport rendje végtelen, így ezt kizárhatjuk. A [egesz-szamok-maradekosztalyai]
      alapján $m=0$ esetén végtelen sok, míg $m\gt 0$ esetén pontosan $m$ darab modulo $m$ maradékosztály létezik.
  - type: formula
    lead-in: |
      Ez alapján tehát kizárásos alapon csak az $m=2$ eset lehetséges, azaz fennáll az alábbi izomorfia:
    content: |
      \Z^{\times} \simeq (\Z/2\Z)^+
  - type: formula
    lead-in: |
      A $\Z^{\times}$ multiplikatív csoport műveleti tábláját az alábbi táblázatban láthatjuk:
    content: |
      \begin{array}{c|cc} \cdot & 1 & -1 \\ \hline 1 & 1 & -1 \\ -1 & -1 & 1 \end{array}
  - type: formula
    lead-in: |
      A $(\Z/2\Z)^+$ additív csoport műveleti táblája pedig a következő:
    content: |
      \begin{array}{c|cc} + & [0]_2 & [1]_2 \\ \hline [0]_2 & [0]_2 & [1]_2 \\ [1]_2 & [1]_2 & [0]_2 \end{array}
  - type: narrative
    content: |
      Látható, hogy mindössze az elemek és a művelet elnevezésében van különbség a két csoport között, de ettől
      eltekintve teljesen ugyanúgy viselkednek, azaz ***izomorfak*** egymással.
