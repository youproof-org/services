epilogue:
  - type: narrative
    content: |
      Ebben a részben megismerkedtünk a polinomok és polinomgyűrűk fogalmával. Az itt megismert összefüggéseket
      felhasználva igazoltuk, hogy prím modulus esetén mindig létezik primitív gyök. Ezután a Carmichael-számokat
      jellemeztük az úgynevezett Korselt-kritérium segítségével, majd ezt felhasználva lényegesen javítottunk a
      Miller-Rabin-prímteszt hibabecslésén. Végül megvizsgáltuk azt a kérdést, hogy miért jelent súlyos biztonsági
      kockázatot, ha az RSA kulcsok generálásakor véletlenül Carmichael-számokat használunk.
  - type: narrative
    content: |
      Ezzel számelméleti vizsgálataink végére értünk. A sorozat utolsó részében arról fogunk mesélni, hogy a talán
      nem is olyan távoli jövőben az úgynevezett kvantumszámítógépek milyen kihívások elé fogják állítani
      főhőseinket, és mik azok a módszerek, amelyek segítségével megbírkózhatnak e kihívásokkal.
  - type: narrative
    content: |
      Az utolsó részt itt találod...