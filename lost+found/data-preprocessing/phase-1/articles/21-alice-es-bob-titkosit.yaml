epilogue:
  - type: narrative
    content: |
      Ebben a részben tehát megtanultunk lineáris diofantoszi egyenleteket megoldani a kibővített euklidészi
      algoritmus segítségével. Ezután az Euler-féle $\varphi$-függvény kiszámításához szükséges összefüggéseket
      tisztáztuk. Végül a moduláris hatványozáshoz mutattunk egy igen hatékony módszert, az úgynevezett ismételt
      négyzetreemelések módszerét. Ezután ismertettük az RSA-algoritmus részleteit, amelyet egy konkrét példán ki
      is próbáltunk.
  - type: narrative
    content: |
      Ebből úgy tűnik, hogyha egy üzenetet egy kulcspár valamelyik tagjával &ndash; legyen az akár a publikus, akár
      a titkos kulcs &ndash; kódolunk, majd az így kapott eredményt dekódoljuk a kulcspár másik tagjával, akkor
      varázslatos módon az eredeti üzenetet kapjuk vissza. A következő részben matematikai bizonyítást adunk arra,
      hogy ez az összefüggés valóban bármilyen, az ismertetett kritériumoknak megfelelő kulcspár, továbbá bármilyen
      üzenet esetén fennáll. Ezután megismerjük azokat a módszereket, amelyek segítségével viszonylag könnyedén
      találhatunk többszázjegyű prímszámokat az RSA kulcsok generálásához.