abstract:
  - type: narrative
    content: |
      Az előző részben azt vizsgáltuk meg, hogy a 18. részben bevezetett kongruencia, maradékosztály és
      maradékosztálygyűrű fogalmai mit jelentenek az egész számok esetében. Láthattuk, hogy a kongruenciákkal
      nagyjából ugyanúgy kell számolni, mint a hagyományos egyenletekkel, de azért bizonyos esetekben vigyázni
      kell. Ezután megismerkedtünk az Euler-féle $\varphi$-függvénnyel, amely a modulo $m$ redukált
      maradékosztályok számát adja meg. Végül az úgynevezett lineáris kongruenciák megoldhatóságának feltételeit,
      valamint az Euler-Fermat tételt ismertük meg. Ugyanis az ebben a részben ismertetett RSA-eljárás esetén ezek
      teremtik meg a nyilvános és titkos kulcsok közötti számelméleti kapcsolatot.
  - type: narrative
    content: |
      De vajon hogyan lehet a legnagyobb közös osztó kiszámítására szolgáló euklidészi algoritmust lineáris
      kongruenciák megoldásához is használni? Hogyan kell kiszámítani az Euler-féle $\varphi$-függvény értékét egy
      adott számra, és milyen információra van ehhez szükség? Hogyan működik az RSA nevű aszimmetrikus kulcsú
      rejtjelező eljárás? Ebben a részben erről lesz szó...
