      teljes cikksorozat elejét itt találod.
prologue:
  - type: narrative
    content: |
      Ahhoz, hogy a szorzást is kiterjesszük az előző részben bevezetett új számkörre, ismét az intuíciónkra kell
      hagyatkoznunk. Kezdhetnénk persze azzal, hogy megadunk egy képletet, mint a $\Z$ halmaz elemei közötti
      szorzás definícióját. Ezzel azonban elveszne az az információ, hogy miért éppen azt a képletet használjuk,
      nem pedig mást. Először is jelöljük ki a céljainkat.
  - type: narrative
    content: |
      Az előző részben ugye azt mondtuk, hogy a Peano-axiómarendszer ([peano-axiomarendszer]) által definiált $\N$
      halmazt szeretnénk beágyazni a $\Z$ halmazba egy úgynevezett struktúratartó leképezéssel. Az eredeti $\N$
      halmazt átmenetileg $\N_1$-gyel, míg annak $\Z$-beli képét $\N_2$-vel jelöltük. A [egesz-szamok-osszeadasa]
      szerinti $\oplus$ műveletről megmutattuk ([termeszetes-szamok-beagyazasa-osszegtarto]), hogy az az
      $f(n)=[(n;0)]$ leképezés mellett valóban "ugyanúgy viselkedik" az $\N_2$ halmazon, mint a Peano-összeadás az
      $\N_1$ halmazon.
  - type: narrative
    content: |
      Hasonló a célunk a most bevezetendő $\odot$ művelettel kapcsolatban ugyanezen leképezés mellett. Ezt a
      műveletet szorzásnak fogjuk nevezni, és ugyanúgy a teljes $\Z$ halmazon szeretnénk értelmezni, mint az
      $\oplus$ műveletet. Ennek a halmaznak az elemei ugye a természetes számpárok ekvivalencia-osztályai
      ([egesz-szamok-halmaza]). Mi lehet hát két ilyen ekvivalencia-osztály "szorzata"?
