epilogue:
  - type: narrative
    content: |
      Ebben a részben tehát intuitív módon értelmeztük a szorzás műveletét is az egész számok halmazán. Ezután
      megmutattuk róla, hogy teljesíti a megszokott azonosságokat, valamint ugyanúgy viselkedik, mint a
      Peano-szorzás az $\N$ halmazon. Végül megismerkedtünk néhány hasznos absztrakt algebrai fogalommal, és
      megmutattuk, hogy a $\Z$ halmaz egy úgynevezett kommutatív, egységelemes gyűrűt alkot az új műveleteinkkel,
      emiatt a kivonás korlátlanul elvégezhető rajta. Így már tulajdonképpen teljessé vált $\N$ beágyazása $\Z$-be
      a $\leq$ rendezési reláció kiterjesztésétől eltekintve, amelyet a következő részben fogunk elvégezni.
      Megemlítettük azonban, hogy az osztás még a $\Z$ halmazon sem végezhető el korlátlanul. Ez rövidesen elvezet
      minket az egyik legfontosabb számelméleti fogalomhoz, méghozzá az oszthatóság kérdéséhez.
