abstract:
  - type: narrative
    content: |
      Az előző részben kényelmi okok miatt elkezdtük kibővíteni a szám fogalmát. Azon a nem is olyan egyszerű
      absztrakciós úton kezdtünk el haladni, amelyen őseinknek is végig kellett menniük. Eddig a számokat bizonyos
      dolgok, sokaságok megszámlálására használtuk, így látszólag semmi értelme sincs a "semminél kevesebb"
      mennyiségekről beszélni. Ezt félretéve azonban láthattuk, hogy például adósság, vagy valamilyen hiány
      kifejezésére igen praktikus eszközt kaphatunk a kezünkbe. Ennek az absztrakciónak a keretében új algebrai
      fogalmakkal ismerkedtünk meg.
  - type: narrative
    content: |
      Az egész számokat természetes számpárok ún. ekvivalencia-osztályaiként határoztuk meg, amelyek között egy
      összeadásnak nevezett műveletet is definiáltunk. Ezután elkezdtük beágyazni ebbe az új számhalmazba a
      Peano-axiómarendszer szerinti $\N$ halmazt egy úgynevezett injektív homomorfizmus &ndash; azaz struktúratartó
      leképezés &ndash; segítségével. De vajon hogyan tudjuk a szorzás műveletét is ésszerű módon kiterjeszteni a
      számegyenes 0-tól balra eső részére? Mit jelent az absztrakt algebrában a "neutrális elem", az "inverz", a
      "gyűrű" és a "test" fogalma? Hogyan definiálható a kivonás művelete az egész számok között? Mi a helyzet az
      osztással? Ebben a részben erről lesz szó...
