type: chapter
name: 18-alice-es-bob-felcsavarja-a-szamegyenest
title: Alice és Bob felcsavarja a számegyenest

abstract:
  - type: narrative
    content: |
      Az előző részben a legnagyobb közös osztó fogalmát általánosítva megismerkedtünk a kitüntetett közös osztó
      fogalmával. Megmutattuk, hogy amennyiben bármely két elemnek létezik a kitüntetett közös osztója egy
      integritástartományban, úgy az elemek prímtényezős felbontásai &ndash; ha egyáltalán léteznek &ndash;
      egyértelműek lesznek. A kitüntetett közös osztó kiszámításához ismertettük az euklidészi algoritmus
      alapgondolatát a pozitív egész számokon. Ezt az euklidészi norma fogalmának bevezetésével sikerült működésre
      bírni egyéb integritástartományokon is. Ezeket euklidészi gyűrűknek neveztük. Igazoltuk azt is, hogy a
      prímtényezős felbontás egyértelműségén túl annak létezése is biztosított ezekben a speciális gyűrűkben. Végül
      igazoltuk, hogy az egész számok $\Z$ gyűrűje szintén euklidészi gyűrű, és így valóban teljesül benne a
      számelmélet alaptétele.
  - type: narrative
    content: |
      De vajon hogyan lehet "felcsavarni" a számegyenest úgy, hogy az alkalmas legyen kriptográfiai kódoló és
      dekódoló függvények képzéséhez? Mit jelent a "kongruencia" fogalma, és hogyan lehet ezt általánosítani az
      úgynevezett "ideálok" és "gyűrűhomomorfizmusok" segítségével? Mik azok a "maradékosztálygyűrűk" és hogyan
      kell bennük számolni? Ebben a részben erről lesz szó...
