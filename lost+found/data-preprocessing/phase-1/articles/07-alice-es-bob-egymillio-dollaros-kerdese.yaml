epilogue:
  - type: narrative
    content: |
      A következő részben megismerkedünk egy fontos fogalommal, amelynek a segítségével az algoritmikus problémákat
      össze tudjuk majd hasonlítani "nehézség" szempontjából. Ennek kapcsán megismerkedünk az $NP$ problémaosztály
      "krémjével", azokkal a problémákkal, amelyek bizonyos tekintetben a legnehezebb $NP$-beli feladatoknak
      tűnnek. Ekkor fog világossá válni, hogy miért valószínűsítjük annyira, hogy $P$ nem azonos $NP$-vel, még ha
      egzakt bizonyításunk nincs is erre. A kérdés többek között azért is rendkívül fontos, mivel a modern
      információbiztonsági és rejtjelezési eljárások 5. részben említett algoritmikus biztonsága alapvetően ezen
      áll vagy bukik.