name: 04-az-euklideszi-algoritmus-alapgondolata
title: Az euklidészi algoritmus alapgondolata

references:
  asszocialtsag-tulajdonsagai:
    target:
      type: theorem
      name: asszocialtsag-tulajdonsagai
  kituntetett-kozos-oszto-tulajdonsagai:
    target:
