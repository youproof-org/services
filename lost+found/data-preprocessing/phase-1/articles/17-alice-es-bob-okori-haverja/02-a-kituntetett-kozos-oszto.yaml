type: section
name: 02-a-kituntetett-kozos-oszto
title: A kitüntetett közös osztó

references:
  kituntetett-kozos-oszto:
    target:
      type: definition
      name: kituntetett-kozos-oszto
  legnagyobb-kozos-oszto-letezese:
    target:
