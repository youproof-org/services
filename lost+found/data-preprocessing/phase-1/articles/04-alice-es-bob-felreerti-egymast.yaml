epilogue:
  - type: narrative
    content: |
      Az adatainkat tehát a rosszminőségű kommunikációs csatornák okozta adatvesztéstől meg kell védenünk. Ezért
      ebben a részben tettünk egy rövid kitérőt az információelmélet egy másik nagy területe, a csatornakódolás és
      a hibajavító kódok elmélete irányába. Érintőlegesen bemutattuk ezek működésének alapelveit, illetve a
      legfontosabb kódelméleti alapfogalmakat. Ezután megemlékeztünk a rendkívül meglepő csatornakódolási tételről,
      amely optimális csatornakódok létezését igazolja. Végül megemlítettük az ilyen kódok keresésére indított
      kutatások jelenlegi állását.
  - type: narrative
    content: |
      A modellünk azonban még nem teljes. Az adatainkat ugyanis nem csak a sérülésektől, hanem a rossz szándékú
      támadóktól is meg kell védenünk. A következő rész fontos szereplőjévé lép majd elő a korábban már említett
      Eve, aki a csatorna lehallgatásával bizalmas információkra szeretné rátenni az enyves kezét. Ezen kívül
      történetünk egy új szereplőjével is meg fogunk ismerkedni, aki még az Eve-énél is gonoszabb tettektől sem
      riad vissza némi anyagi haszon reményében...