    alt: Információátviteli modell (részlet)
    caption: Információátviteli modell (részlet)
  - type: narrative
    content: |
      Sejthető, hogy innentől kezdve az Alice és Bob (illetve az általuk használt számítógépek) közötti
      kommunikáció gyakorlatilag számok küldözgetéséből fog állni. Ez az a pont, amikortól kezdve a kriptográfiára
      már nem nyelvészeti, hanem egyértelműen informatikai/matematikai tudományként kell tekintenünk. A következő
      részben a számrendszerekre fogunk kitérni és megvizsgáljuk, hogy az informatikai eszközök milyen formában
      tárolják az adatokat.