prologue:
  - type: narrative
    content: |
      Az RSA-algoritmus lépéseit tehát már ismerjük. Mutattunk is egy konkrét példát az alkalmazására. Ebben a
      példában először Bob generált magának egy RSA kulcspárt, amelynek publikus részét elérhetővé tette Alice
      &ndash; illetve bárki más &ndash; számára, a titkos részét viszont nem adta ki a kezéből. Alice ezután a
      **sziabobmiahelyzet** üzenetet kódolta Bob publikus kulcsával, a titkosított üzetetet pedig átküldte a
      nembiztonságos csatornán. Ezt az üzenetet egy támadó, de még maga Alice sem tudja dekódolni. Arra ugyanis
      csak Bob képes, mivel nála van az ehhez szükséges titkos kulcs.
  - type: narrative
    content: |
      Úgy tűnik tehát, hogyha egy üzenetet egy kulcspár valamelyik tagjával &ndash; legyen az akár a publikus, akár
      a titkos kulcs &ndash; kódolunk, majd az így kapott eredményt dekódoljuk a kulcspár másik tagjával, akkor
      varázslatos módon az eredeti üzenetet kapjuk vissza. Most azt fogjuk megmutatni, hogy ez az összefüggés
      bármilyen, az ismertetett kritériumoknak megfelelő kulcspár, továbbá bármilyen üzenet esetén valóban fennáll.
      Ehhez azonban szükségünk lesz két nagyon fontos tételre. Ismerkedjünk is meg az elsővel.
