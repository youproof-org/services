epilogue:
  - type: narrative
    content: |
      Ebben a részben tehát megismerkedtünk a kis Fermat-tétellel és a több kongruenciából álló
      kongruenciarendszerek egyértelmű megoldhatóságát biztosító kínai maradéktétellel. Ezek segítségével
      igazoltuk, hogy az RSA-algoritmus valóban mindig helyesen működik. Ezután megismerkedtünk egy olyan
      konstrukcióval, amelynek a segítségével kettő vagy több gyűrűből egy újabb gyűrűt tudunk létrehozni azok
      direkt szorzataként. A kínai maradéktétel következményeként megmutattuk, hogy ezen a módon bármely összetett
      modulusú maradékosztálygyűrű felbontható egymáshoz relatív prím modulusú maradékosztálygyűrűk direkt
      szorzatára, amely ráadásul izomorf lesz az eredeti gyűrűvel. Ezt és a kis Fermat-tétel egy következményét
      kihasználva Alice és Bob jelentősen gyorsítani tudja az RSA dekódolási eljárást.
  - type: narrative
    content: |
      Történetünk hátralévő néhány részében megtudjuk, hogy hogyan lehet az RSA kulcsokhoz szükséges óriási
      prímszámokat találni anélkül, hogy az idők végezetéig osztáspróbákat kelljen végezni. Ezenkívül
      megismerkedünk néhány olyan módszerrel, amellyel a gonosz Eve képes feltörni az RSA-algoritmust, amennyiben
      Alice és Bob nem kellő körültekintéssel jár el a kulcsgenerálás során. Végezetül elkalandozunk egy kicsit a
      &ndash; talán nem is olyan távoli &ndash; jövőbe, amikor a kvantumszámítógépek korában az RSA már fabatkát
      sem fog érni.