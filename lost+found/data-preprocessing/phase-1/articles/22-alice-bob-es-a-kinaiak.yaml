type: chapter
name: 22-alice-bob-es-a-kinaiak
title: Alice, Bob és a kínaiak

abstract:
  - type: narrative
    content: |
      Az előző részben megismerkedtünk napjaink egyik legfontosabb aszimmetrikus kulcsú rejtjelezési eljárásával,
      az RSA-algoritmussal. Ehhez alapvetően három összetevőre volt szükség. Először is hatékonyan kell tudni
      megoldani lineáris kongruenciákat, amelyhez bemutattuk az euklidészi algoritmus kibővített változatát.
      Másodszor hatékonyan kell tudni kiszámítani az Euler-féle $\varphi$-függvény értékét. Láttuk, hogy a bemeneti
      szám prímtényezőinek ismeretében ez gyerekjáték. Megemlítettük ugyanakkor, hogy a prímtényezők ismerete
      nélkül jelenlegi tudásunk szerint ez gyakorlatilag kivitelezhetetlen, amennyiben ezek a prímtényezők kellően
      nagyok. Ez adja az RSA-eljárás biztonságát. Harmadszor a kódoló és dekódoló függvények elvégzéséhez
      hatékonyan kell tudni moduláris hatványozást végezni, amelyhez az ismételt négyzetreemelések módszerével
      ismerkedtünk meg. Végül egy konkrét példán ki is próbáltuk az eljárást, és megmutattuk, hogy a kulcspár egyik
      tagjával kódolt üzenetet varázslatos módon a kulcspár másik tagjával lehet dekódolni.
  - type: narrative
    content: |
      De vajon varázslat helyett valójában mi áll az RSA-algoritmus helyes működésénekhátterében? Mit állít a kis
      Fermat-tétel és a kínai maradéktétel, és mi közük van ehhez az egészhez? Mit értünk egy maradékosztálygyűrű
      dekompozíciója alatt? Hogyan lehet ennek segítségével lényegesen felgyorsítani az RSA-dekódolási algoritmust?
      Ebben a részben erről lesz szó...
