epilogue:
  - type: narrative
    content: |
      Ebben a részben tehát megismerkedtünk a modern kriptográfia két alapvető felfedezésével. Az első a
      Diffie-Hellman kulcscsere protokoll volt, amely lehetővé teszi, hogy Alice és Bob a pofátlan Eve szeme
      láttára állapodjanak meg egy közös titkos kulcsban, teljes biztonságban. Láttuk azonban, hogy egy aktív
      támadó könnyedén kijátszhatja ezt a rendszert, hacsak nem tudjuk kibővíteni a protokollt valamilyen
      partnerhitelesítéssel. Ezért megismerkedtünk az úgynevezett aszimmetrikus kulcsú rejtjelezés
      alapgondolatával. A következő részben erre építkezve bemutatjuk a digitális aláírás és partnerhitelesítés
      működésének alapjait, majd a további részekben elkezdünk megismerkedni az RSA-algoritmus számelméleti
      hátterével.