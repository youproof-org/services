prologue:
  - type: narrative
    content: |
      Amikor a 11. részben elkezdtük a számelmélet felépítését, viszonylag hamar eljutottunk arra a felismerésre,
      hogy bizonyos, az egész számokkal kapcsolatos fogalmakat célszerű absztrakt szinten kezelni. Így jutottunk el
      a 14. részben a ***neutrális elem*** ([neutralis-elem]), az ***inverz*** ([inverz-elem]) és végül a
      ***gyűrű*** ([gyuru-test]) fogalmához. Ezáltal általános érvényű összefüggéseket tudtunk feltárni, amelyek az
      ***ideálok elméletén*** (18. és 19. rész) keresztül elvezettek minket a ***számelmélet alaptételével***
      kapcsolatos alapvető fontosságú felismerésekhez. Végül a 20., 21., és 22. részekben az így megszerzett
      ismereteket alkalmazhattuk az egész számok $\Z$ gyűrűjére. Ezáltal részletesen megismerhettük a napjainkban
      leggyakrabban használt titkosítási eljárás, az ***RSA-algoritmus*** működését.
  - type: narrative
    content: |
      Azonban az előző részben ismertetett prímtesztelő eljárásokkal kapcsolatban felmerült egy olyan kérdés,
      amelyet még nem válaszoltunk meg. Nevezetesen: vajon a Miller-Rabin-prímteszt &ndash; ellentétben a
      Fermat-prímteszttel &ndash; valóban képes-e kiszűrni az ***univerzális álprímeket*** ([carmichael-szamok])?
  - type: narrative
    content: |
      Ahhoz, hogy ezt a kérdést megválaszolhassuk, meg kell ismerkednünk az absztrakt algebra egyik fontos
      fegyverével, az úgynevezett ***csoportelmélettel***.
