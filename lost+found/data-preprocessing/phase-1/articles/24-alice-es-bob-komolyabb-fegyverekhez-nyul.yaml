epilogue:
  - type: narrative
    content: |
      Ebben a részben tehát megismerkedtünk az absztrakt algebra egy igen hatékony eszköztárának, az úgynevezett
      csoportelméletnek az alapjaival. Bevezettük a csoport és a részcsoport fogalmát, továbbá definiáltuk, hogy
      mit értünk egy csoport illetve egy csoportelem rendje alatt. Ezután a mellékosztály fogalmának segítségével
      igazoltuk Lagrange tételét, amely egy fontos oszthatósági kapcsolatot mond ki egy csoport és a részcsoportok
      illetve csoportelemek rendjei között. Végül ezt felhasználva megmutattuk, hogy bármilyen páratlan összetett
      szám esetén a redukált maradékosztályoknak legalább a fele Miller-Rabin-tanú. Azaz erre a tesztre nézve nem
      léteznek univerzális álprímek, így gyakorlatilag szinte nincs esélye annak, hogy tévedjen.
  - type: narrative
    content: |
      A hátralévő részekben kicsit mélyebb módszerekkel azt fogjuk igazolni, hogy valójában még jobb a helyzet, és
      a redukált maradékosztályoknak nemhogy a fele, de legalább a háromnegyede Miller-Rabin-tanú. Ehhez a
      csoporthomomorfizmus fogalmával, valamint a Carmichael-számok néhány fontos tulajdonságával fogunk
      megismerkedni. Ezzel befejezzük számelméleti vizsgálatainkat, és a cikksorozat lezárásaként adunk némi
      ízelítőt abból, hogy mi vár Alice-ra és Bob-ra a &ndash; nem is olyan távoli &ndash; jövőben.