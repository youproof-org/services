abstract:
  - type: narrative
    content: |
      Az előző részben intuitív módon kiterjesztettük a szorzás műveletét is az egész számok $\Z$ halmazára. Ezzel
      többnyire teljessé vált a Peano-axiómarendszer ([peano-axiomarendszer]) által definiált természetes számok
      $\N$ halmazának beágyazása ebbe a bővebb, már a negatív számokat is tartalmazó számkörbe. Ezután megmutattuk,
      hogy mind az összeadás, mind pedig a szorzás művelete ugyanúgy viselkedik az eredeti $\N$ halmazon, mint
      annak a beágyazófüggvény szerinti képén. Ez a képhalmaz a $\Z$-nek azon részhalmaza, amely a pozitív egész
      számokat és a $0$ egész számot tartalmazza. Ebben tehát ugyanúgy érvényes a Peano-axiómarendszer, így
      mostantól ezt fogjuk a természetes számok halmazának tekinteni. Ezután megvizsgáltuk, hogy mit értünk
      azalatt, hogy teljesülnek a "szokásos számolási szabályok". Ennek keretében megismerkedtünk a "neutrális
      elem", az "inverz elem", a "gyűrű" és a "test" fogalmával. Végül megmutattuk, hogy az egész számok halmaza az
      összeadás és szorzás műveletével egy kommutatív, egységelemes gyűrűt alkot.
  - type: narrative
    content: |
      De vajon mit jelent a "nullosztómentesség" és az "integritástartomány" fogalma? Hogyan terjesszük ki a
      "kisebb-nagyobb" fogalmát az egész számok körére is, és miért fontos ez a kriptográfiai eljárások
      szempontjából? Milyen absztrakt algebrai megfontolások állnak ennek hátterében, és mit jelent ez általános
      gyűrűk esetén? Ebben a részben erről lesz szó...
