      E definíciók kontextusba helyezése, valamint a hozzájuk kapcsolódó tételek és egyéb fogalmak megismerése
      miatt erőteljesen ajánlott elolvasni az előző és az azelőtti részt, mivel gyakran hivatkozni fogunk rájuk. A
      teljes cikksorozat elejét itt találod.
prologue:
  - type: narrative
    content: |
      A bevezetőben azt írtuk, hogy a természetes számok beágyazása $\Z$-be "többnyire" teljessé vált. Ami még
      hátra van, és ami a továbbiakban szintén fontos lesz számunkra, az a [termeszetes-szamok-rendezese] szerinti
      $\leq$ ***rendezési reláció kiterjesztése*** erre a számhalmazra. Szeretnénk azonban ezt a problémakört minél
      általánosabban &ndash; lehetőleg az előző részben megismert gyűrűk szintjén &ndash; tárgyalni. Ehhez először
      a gyűrűk néhány alapvető tulajdonságával fogunk megismerkedni.
