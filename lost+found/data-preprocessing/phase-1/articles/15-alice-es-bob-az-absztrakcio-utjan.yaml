epilogue:
  - type: narrative
    content: |
      Ebben a részben tehát definiáltuk a "kisebb-nagyobb" fogalmát az egész számok gyűrűjében is. Ezután
      megmutattuk, hogy az valóban a korábban csupán a természetes számok körében értelmezett hasonló reláció
      kiterjesztése. Megvizsgáltuk ezt a kérdéskört egy magasabb absztrakciós szinten általános gyűrűkre is. E
      vizsgálódásaink során sikerült megmutatni, hogy e reláció kiterjesztésének ez az egyetlen módja. Feltéve
      persze, ha bizonyos, az általános iskolából is jól ismert számolási szabályokat az egész számok halmazán is
      érvényben szeretnénk tartani.
  - type: narrative
    content: |
      A továbbiakban ennek a relációnak a felhasználásával meg fogunk ismerkedni az úgynevezett oszthatóság és a
      maradékos osztás fogalmával. Ezek végre elvezetnek majd minket a prímszámokkal kapcsolatos összefüggésekhez.
      Ezeket a kérdéseket továbbra is az általános gyűrűk szintjén fogjuk vizsgálni, már amennyire lehetséges.
      Ezáltal ugyanis átfogóbb képet kaphatunk a modern kriptográfiai eljárások mögött meghúzódó számelméleti
      gondolatokról.