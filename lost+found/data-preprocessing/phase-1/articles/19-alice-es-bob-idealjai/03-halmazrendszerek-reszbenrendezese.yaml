type: section
name: 03-halmazrendszerek-reszbenrendezese
title: Halmazrendszerek részbenrendezése

references:
  antiszimmetrikus-relacio:
    target:
      type: definition
      name: antiszimmetrikus-relacio
  reflexiv-relacio:
    target:
      type: definition
