type: section
name: 07-foidealgyuruk
title: Főideálgyűrűk

references:
  halmazrendszer-minimuma-es-maximuma:
    target:
      type: definition
      name: halmazrendszer-minimuma-es-maximuma
  idealok-metszete-ideal:
    target:
