epilogue:
  - type: narrative
    content: |
      Ebben a részben tehát megismerkedtünk a kriptográfiai hash függvények és a digitális aláírások működésének
      alapjaival. Láttuk, hogy egy nem megfelelő körültekintéssel megválasztott hash függvény esetén milyen
      agyafúrt módon lehet meghamisítani ezeket az aláírásokat. Végül a bizalmi modellek bemutatásán keresztül
      képet kaptunk arról, hogy hogyan történik egy ilyen rendszer résztvevőinek hitelesítése. A következő részben
      azokat a számelméleti összefüggéseket kezdjük el áttekinteni, amelyek mindezt valóban lehetővé teszik, és
      amelyeken például az RSA-eljárás is alapul.