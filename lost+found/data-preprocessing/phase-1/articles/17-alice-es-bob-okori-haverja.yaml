type: chapter
name: 17-alice-es-bob-okori-haverja
title: Alice és Bob ókori haverja

abstract:
  - type: narrative
    content: |
      Az előző részben megismerkedtünk a legfontosabb számelméleti fogalmakkal: oszthatóság, egység, asszociált,
      felbonthatatlan és prímtulajdonságú elemek. Ezután ismertettük a számelmélet alaptételét, amely azt
      biztosítja egy integritástartományban, hogy annak minden elemét egyértelműen elő lehessen állítani
      felbonthatatlan elemek szorzataként. Láttuk, hogy ez nem minden integritástartományban teljesül. Végül
      megmutattuk, hogy ha viszont teljesül, akkor a felbonthatatlanok és a prímek fogalma szükségképpen egybe kell
      essen. Azt is megemlítettük ugyanakkor, hogy ez csupán szükséges, de nem elégséges feltétel az alaptétel
      teljesüléséhez.
  - type: narrative
    content: |
      De vajon milyen elégséges feltételt tudunk mutatni erre vonatkozóan? Az egész számok gyűrűje teljesíti-e ezt
      a kritériumot? Mit jelent a "legnagyobb közös osztó" fogalma és hogyan lehet villámgyorsan kiszámolni az
      euklidészi algoritmus segítségével? Mit tudunk mondani erről általános integritástartományokra? Mik azok az
      euklidészi gyűrűk és mi közük a számelmélet alaptételéhez? Ebben a részben erről lesz szó...
