epilogue:
  - type: narrative
    content: |
      Ebben a részben megismerkedtünk a kitüntetett közös osztó fogalmával, és az euklidészi algoritmussal, amely
      azt képes hihetetlen sebességgel kiszámítani. A kitüntetett közös osztó létezése azért volt nagyon fontos
      számunkra, mivel annak fontos következményei vannak a számelmélet alaptételének egyértelműségi állítására
      nézve. Ezért általánosságban is megvizsgáltuk, mi kell ahhoz, hogy az euklidészi algoritmus valamilyen
      integritástartományon működhessen. Ezzel eljutottunk a maradékos osztás és az euklidészi gyűrűk fogalmához,
      és megmutattuk, hogy az ilyen gyűrűkben mindig teljesül a számelmélet alaptételének mindkét állítása. Végül
      igazoltuk, hogy az egész számok gyűrűje is euklidészi gyűrű &ndash; például az abszolútérték-függvényre, mint
      euklidészi normára nézve.
  - type: narrative
    content: |
      A 9. részben a Diffie-Hellman kulcscsere protokoll kapcsán már felületesen megismerkedtünk az úgynevezett
      óra-, vagy becsületesebb nevén moduláris aritmetikával. Ez szintén egy fontos összetevője az aszimmetrikus
      kulcsú titkosítási eljárásoknak, ezért a következő részben ezt a témakört újra elővesszük. Ám ezt ezúttal a
      gyűrűk absztrakciós szintjén fogjuk megtenni, melynek keretében megismerkedünk az úgynevezett
      maradékosztálygyűrűkkel. Ezenkívül minimálisan érinteni fogjuk az ideálok elméletét is.