prologue:
  - type: narrative
    content: |
      A modern kriptográfiai eljárások szempontjából alapvető fontosságú, hogy az egész számok $\Z$ gyűrűjében
      teljesüljön a számelmélet alaptétele. Egyrészt ez teszi lehetővé, hogy minden egész szám ***egyértelműen***
      előáll prímszámok szorzataként, és így a számelméleti kapcsolatot biztosítja a publikus és a titkos kulcsok
      között ezekben az eljárásokban. Másrészt a prímfaktorizáció feladatának algoritmikus nehézsége biztosítja
      azt, hogy egy támadó számára beláthatatlanul sok ideig tartson kiszámítani a titkos kulcsot a hozzá tartozó
      publikus kulcsból. Ezért ebben a részben alapvető célunk annak igazolása, hogy az egész számok $\Z$
      gyűrűjében valóban teljesül a számelmélet alaptétele.
  - type: narrative
    content: |
      Ennek keretében meg fogunk ismerkedni az ókorból származó ***euklidészi algoritmussal***. Ezzel két egész
      szám úgynevezett ***legnagyobb közös osztóját*** fogjuk tudni elképesztően hatékonyan kiszámítani. Ez az
      eljárás a továbbiakban is fontos lesz számunkra, mivel mind az RSA-ban, mind pedig a prímtesztelési
      eljárásokban alapvető szerepet játszik. Ezután ezt az eljárást fogjuk általánosítani oly módon, hogy ne csak
      az egész számok gyűrűjén, hanem minden olyan integritástartományon működjön, amely bizonyos kritériumoknak
      eleget tesz. Ezeket ***euklidészi gyűrűknek*** fogjuk nevezni. Végül megmutatjuk, hogy minden euklidészi
      gyűrűben &ndash; és így speciálisan az egész számok gyűrűjében is &ndash; teljesül a számelmélet alaptétele.
