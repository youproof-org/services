    alt: Aszimmetrikus kulcsú rejtjelező modell
    caption: Aszimmetrikus kulcsú rejtjelező modell
  - type: narrative
    content: |
      Ez az alapgondolat forradalmat indított el a kriptográfiában, megindult ugyanis a versenyfutás a dicsőségért,
      amely a fentieknek megfelelő $E$ és $D$ függvények elsőként való megtalálásáért járt. A dicsőség Ron
      Rivest-nek, Adi Shamir-nak, és Len Adleman-nak jutott, akik 1977-ben publikálták az úgynevezett
      ***RSA-algoritmust***, amely alapjaiban változtatta meg világunkat.