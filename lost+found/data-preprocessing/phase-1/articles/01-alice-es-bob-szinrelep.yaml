epilogue:
  - type: narrative
    content: |
      A sorozat következő részeiben érdekes gyakorlati példákon keresztül vázlatosan áttekintjük az
      információátviteli rendszerek absztrakt modelljét. Ebből világos lesz, hogy a kriptográfia tudománya hol
      kapcsolódik be ebbe a játszmába. Ezután pedig részletesen rátérünk a kulcsmegosztás problémájának
      megoldására, és sok egyéb, a modern kriptográfiai eljárások kapcsán felmerülő kérdés megválaszolására.