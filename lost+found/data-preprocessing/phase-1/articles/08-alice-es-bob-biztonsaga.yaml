epilogue:
  - type: narrative
    content: |
      Ebben a részben tehát megismertük a Karp-redukció fogalmát, amelynek segítségével összehasonlíthatóvá válnak
      az algoritmikus problémák a nehézségük szempontjából. Definiáltuk az NP-teljes problémák osztályát,
      amelyekről ugyan nem tudjuk biztosan, hogy valóban olyan nehezek, mint amilyennek látszanak, de megmutattuk,
      hogy miért lenne rendkívül meglepő, ha mégsem ez lenne a helyzet. Most már van egy átfogó képünk arról, hogy
      mit tekintünk algoritmikusan "nehéz" vagy "könnyű" feladatnak. A következő részekben felvázoljuk egy olyan
      rejtjelező rendszer alapjait, amellyel Alice és Bob meg tudja oldani a kulcsmegosztás problémáját anélkül,
      hogy személyesen találkozniuk kéne. Ez az eljárás továbbá az 5. részben bemutatott Mallory, mint aktív támadó
      elleni védelemben is komoly szerepet játszik, mint azt látni fogjuk.