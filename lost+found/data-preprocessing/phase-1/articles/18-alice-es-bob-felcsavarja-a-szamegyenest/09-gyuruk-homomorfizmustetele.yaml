type: section
name: 09-gyuruk-homomorfizmustetele
title: Gyűrűk homomorfizmustétele

references:
  gyuruhomomorfizmus:
    target:
      type: definition
      name: gyuruhomomorfizmus
  gyuruhomomorfizmus-szerinti-kongruenciak-ekvivalenciajanak-feltetele:
    target:
      type: theorem
      name: gyuruhomomorfizmus-szerinti-kongruenciak-ekvivalenciajanak-feltetele
  idealok-es-gyuruhomomorfizmusok:
    target:
