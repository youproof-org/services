prologue:
  - type: narrative
    content: |
      A 18. részben ismertettük az úgynevezett ***moduláris aritmetika***, azaz a maradékokkal való számolás
      absztrakt algebrai hátterét. Mint ahogyan azt az Olvasó is látni fogja, az ennek kapcsán felépített fogalmak
      és tételek szinte egytől egyig párhuzamba állíthatók lesznek az ebben a részben leírtakkal. Ezekre a szép
      párhuzamokra a tárgyalás során folyamatosan rá fogunk mutatni annak érdekében, hogy lehessen mihez kötni az
      itt bevezetett, sok esetben meglehetősen absztrakt csoportelméleti fogalmakat. Ettől függetlenül azt
      javasoljuk az Olvasónak, hogy gyakran lapozzon vissza az említett 18. részhez, mivel ezek a párhuzamok adott
      esetben egészen más megvilágításba helyezhetik az eddig tanultakat.
  - type: narrative
    content: |
      A 18. részben elsőként egy nagyon fontos, az egész számok $\Z$ gyűrűjén értelmezett függvénnyel, az
      úgynevezett ***modulo $m$ maradékképző függvénnyel*** ismerkedtünk meg ([modularis-osszeadas-es-szorzas]). Ez
      a $\bmod_m$-mel jelölt függvény minden egész számhoz az $m$ egész számmal való ***nemnegatív osztási
      maradékát*** rendeli hozzá. Ennek a függvénynek az értékkészletét $Z_m$-mel jelöltük, amelyen egy
      összeadásnak és egy szorzásnak nevezett műveletet is értelmeztünk a [modularis-osszeadas-es-szorzas]ban
      leírtaknak megfelelően.
  - type: narrative
    content: |
      Ezután igazoltuk, hogy a $Z_m$ halmaz ezzel a két művelettel egy kommutatív gyűrűt alkot. Ám ami talán még
      fontosabb volt számunkra, hogy a $\bmod_m$ maradékképző függvény egy szoros kapcsolatot létesített a $\Z$ és
      a $Z_m$ gyűrűk között.
