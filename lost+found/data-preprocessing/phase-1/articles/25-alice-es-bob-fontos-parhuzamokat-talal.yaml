abstract:
  - type: narrative
    content: |
      Az előző részben megismerkedtünk az úgynevezett csoportelmélet néhány alapfogalmával és összefüggésével,
      amely az absztrakt algebra egy igen hatékony eszköze. Bevezettük a csoport, a részcsoport fogalmát, valamint
      definiáltuk, hogy mit értünk egy csoport illetve egy csoportelem rendje alatt. Ezután a mellékosztály
      fogalmának bevezetésével igazoltuk Lagrange tételét, amely egy fontos oszthatósági kapcsolatot mond ki egy
      csoport és a részcsoportok illetve csoportelemek rendjei között. Végül ezt felhasználva megmutattuk, hogy
      bármilyen páratlan összetett szám esetén a redukált maradékosztályoknak legalább a fele Miller-Rabin-tanú,
      így gyakorlatilag szinte nincs esélye annak, hogy a Miller-Rabin-prímteszt tévedjen. Meg fogjuk azonban
      mutatni, hogy még ennél is jobb a helyzet, és a redukált maradékosztályoknak nemhogy a fele, de legalább a
      háromnegyede Miller-Rabin-tanú. Ehhez azonban ebben a részben megismerkedünk néhány újabb, fontos
      csoportelméleti összefüggéssel.
  - type: narrative
    content: |
      Mik azok a csoporthomomorfizmusok, normálosztók és faktorcsoportok? Milyen párhuzam mutatható ki ezek és a
      korábban már ismertetett gyűrűhomorfizmusok, ideálok és maradékosztálygyűrűk között? Milyen szép
      struktúratartó tulajdonságai vannak egy csoporthomomorfizmusnak? Mik azok a ciklikus csoportok, és összesen
      hány ilyen létezik? Ebben a részben erről lesz szó...
