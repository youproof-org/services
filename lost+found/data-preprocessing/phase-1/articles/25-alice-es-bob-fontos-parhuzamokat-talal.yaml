epilogue:
  - type: narrative
    content: |
      Ebben a részben tehát némileg kibővítettük csoportelméleti eszköztárunkat. A 18. részben megismert
      gyűrűhomomorfizmusok mintájára bevezettük a csoporthomomorfizmus fogalmát, valamint pontosan jellemeztük ezek
      magjait. Fontos párhuzamokat felfedve megmutattuk, hogy ezeknek is &ndash; a gyűrűhomomorfizmusok kapcsán
      bevezetett ideálokhoz hasonlóan &ndash; bizonyos speciális tulajdonságoknak kell megfelelniük. Így jutottunk
      el a normálosztó és a faktorcsoport fogalmához, majd ismertettük a csoportok homomorfizmustételét és további
      struktúratartó tulajdonságokat igazoltunk. Végül megismerkedtünk a generálás és az ehhez kapcsolódó ciklikus
      csoportok fogalmával.
  - type: narrative
    content: |
      Ezeket a csoportelméleti ismereteket a következő részben a Miller-Rabin-prímteszt
      hibavalószínűség-becslésének javítására fogjuk felhasználni. A cikksorozat lezárásaként igazolni fogjuk
      ugyanis, hogy a redukált maradékosztályoknak nemhogy a fele, de legalább a háromnegyede Miller-Rabin-tanú,
      így a prímteszt még gyorsabban ad majdnem biztos eredményt.
