    caption: Caesar-kód

  - type: narrative
    content: |
      Egy fokkal bonyolultabb Eve helyzete, ha nem Caesar-kódról van szó, hanem valamilyen általánosabb
      monoalfabetikus kódolásról, amely jobban összekeveri az ábécé betűit. Azonban gyakoriságelemzéssel az ilyen
      kódszövegek megfejtése sem jelent túl nagy problémát.
  - type: figure
    lead-in: |
      Az alábbi ábrán egy általános monoalfabetikus kódolás által megvalósított leképezést láthatunk:
    src: 02-altalanos-monoalfabetikus-kod.jpg
