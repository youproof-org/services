type: section
name: 03-az-euler-fele-latex-varphi-latex-fuggveny-kiszamitasa
title: 'Az Euler-féle [latex]\varphi[/latex]-függvény kiszámítása'

references:
  egesz-szamok-maradekosztalygyurui:
    target:
      type: theorem
      name: egesz-szamok-maradekosztalygyurui
  euler-fuggveny:
    target:
      type: definition
      name: euler-fuggveny
  euler-fuggveny-alternativ-definicio:
    target:
      type: theorem
      name: euler-fuggveny-alternativ-definicio
  euler-fuggveny-szorzattarto-tulajdonsaga:
    target:
      type: theorem
      name: euler-fuggveny-szorzattarto-tulajdonsaga
  redukalt-maradekosztaly:
    target:
      type: definition
      name: redukalt-maradekosztaly

body:
  - type: narrative
    content: |
      Az ***RSA-algoritmus*** másik fontos összetevőjeként ebben a szakaszban megtanuljuk, hogy hogyan lehet
      kiszámítani a [euler-fuggveny]ban ismertetett Euler-féle $\varphi$-függvény értékét bármilyen tetszőleges
      pozitív egész számra. A definíció szerint egy $m$ pozitív egész szám esetén ez a függvény a ***modulo $m$
      redukált maradékosztályok számát*** adja meg. A [redukalt-maradekosztaly] alapján ezek épp a
      [egesz-szamok-maradekosztalygyurui]ben definiált $\Z/m\Z$ maradékosztálygyűrű azon elemei, amelyek
      invertálhatók a maradékosztályok közötti szorzásra nézve.
  - type: narrative
    content: |
      Az előző részben a [euler-fuggveny-alternativ-definicio]ben megmutattuk, hogy ez a szám éppenséggel
      megegyezik a $0$ és $m$ közötti, ***$m$-hez relatív prímek számával***, amely tehát az Euler-féle
      $\varphi$-függvénynek egy alternatív definícióját adja.
  - type: formula
    lead-in: |
      Például a $0$ és $18$ közötti, $18$-hoz relatív prímek halmaza az alábbi számhalmaz:
    content: |
      \{1; 5; 7; 11; 13; 17\}
  - type: narrative
    content: |
      Ezek száma $6$, így tehát $\varphi(18)=6$. Az alábbi tételben a $\varphi$-függvény egy fontos tulajdonságát
      igazoljuk.
  - type: embed
    target:
      type: theorem
      name: euler-fuggveny-szorzattarto-tulajdonsaga
  - type: embed
    target:
      type: proof
      name: euler-fuggveny-szorzattarto-tulajdonsaga-bizonyitas
  - type: narrative
    content: |
      Például próbáljuk ez alapján meghatározni a $\varphi(77)$ értékét.
  - type: formula
    lead-in: |
      Ehhez a $77$ prímtényezős felbontását, valamint az iménti tételt használva az alábbi adódik:
    content: |
      \varphi(77)=\varphi(7\cdot 11)=\varphi(7)\cdot \varphi(11)
  - type: narrative
    content: |
      Ha feltételezzük, hogy a $\varphi(7)=6$ és a $\varphi(11)=10$ értékeket ***valahogyan*** kiszámítottuk, akkor
      a $\varphi(77)=60$ végeredmény már könnyen adódik. Az alábbiakban ezt a ***"valahogyan"***-t vizsgáljuk meg.
      Ehhez azonban szükségünk lesz az alábbi segédtételre.
  - type: embed
    target:
      type: theorem
      name: primhatvanyhoz-relativ-primek
  - type: embed
    target:
      type: proof
      name: primhatvanyhoz-relativ-primek-bizonyitas
  - type: narrative
    content: |
      Ennek segítségével mostmár tetszőleges prímszámra &ndash; vagy még általánosabban ***tetszőleges
      prímhatványra*** &ndash; könnyedén ki tudjuk számítani az Euler-féle $\varphi$-függvény értékét
  - type: embed
    target:
      type: theorem
      name: euler-fuggveny-primhatvanyokra
  - type: embed
    target:
      type: proof
      name: euler-fuggveny-primhatvanyokra-bizonyitas
  - type: narrative
    content: |
      Ennek és a [euler-fuggveny-szorzattarto-tulajdonsaga]nek a segítségével mostmár bármilyen $m\gt 0$ pozitív
      egész szám esetén könnyedén ki tudjuk számítani a $\varphi(m)$ értéket. Ehhez "mindössze" az $m$ egész szám
      prímtényezős felbontására van szükségünk.
  - type: narrative
    content: |
      Tegyük fel például, hogy szeretnénk kiszámítani a $\varphi(93\ 372\ 871)$ értéket.
  - type: formula
    lead-in: |
      Tegyük fel továbbá, hogy ismerjük a $93\ 372\ 871$ prímtényezős felbontását:
    content: |
      93\ 372\ 871=5387\cdot 17333
  - type: formula
    lead-in: |
      Ezután alkalmazhatjuk a fenti két tételt:
    content: |
      \begin{aligned}\varphi(93\ 372\ 871)&=\varphi(5387)\cdot \varphi(17333)=\\&=5386\cdot 17332=93\ 350\
      152\end{aligned}
  - type: narrative
    content: |
      Ha tehát ismerjük a bemeneti $m$ egész szám prímtényezős felbontását, akkor könnyedén ki tudjuk számítani a
      $\varphi(m)$ értéket. Ami viszont kriptográfiai szempontból hasonlóan fontos: ***Ha nem ismerjük $m$
      prímtényezős felbontását, akkor nem ismeretes hatékony algoritmus $\varphi(m)$ kiszámításához.*** Ez lényeges
      szerepet játszik az ***RSA rejtjelező eljárás*** esetén. Mielőtt azonban ezt ismertetnénk, szükségünk van egy
      harmadik összetevőre is.