epilogue:
  - type: narrative
    content: |
      A következő részben kilépünk a természetes számok köréből egy sokkal előnyösebb algebrai tulajdonságokkal
      bíró számkörbe. Ennek keretében bemutatjuk azt az absztrakciós utat, amelyet az emberiség hajnalán őseinknek
      is meg kellett tenniük, és ezzel párhuzamosan megismerkedünk néhány absztrakt algebrai fogalommal. Ezek
      segítségével általánosabb módon tudjuk majd tárgyalni azokat a számelméleti összefüggéseket, amelyek végül a
      prímszámok elméletén keresztül elvezetnek minket napjaink biztonságos kommunikációjának alapjaihoz.