type: chapter
name: 12-alice-es-bob-rendet-tesz
title: Alice és Bob rendet tesz

abstract:
  - type: narrative
    content: |
      Az előző részben kitöröltünk mindent a fejünkből, amit az általános iskolában a számokról tanultunk, és
      elkezdtük felépíteni a modern kriptográfiai eljárások alapját jelentő számelméletet a semmiből. Mindössze 4
      egyszerű állításból indultunk ki, amelyeket Peano-axiómáknak nevezünk, és amelyek rögzítik a pozitív egész
      számok és a 0 alapvető tulajdonságait. Ezek halmazát természetes számoknak nevezzük és $\N$-nel jelöljük.
      Szigorúan az axiómákat használva bevezettünk az $\N$ halmazon egy összeadásnak nevezett műveletet, amelyről
      megmutattuk, hogy &ndash; az axiómák logikai következményeként &ndash; valóban teljesíti az általános
      iskolában jól megszokott tulajdonságokat. De vajon mi minden következik még ebből a 4 axiómából? Milyen
      alaptulajdonságai vannak a szorzás műveletének és mi az oka, hogy ezek valóban teljesülnek? Mik azok a
      relációk és hogy jön ide a "kő-papír-olló" nevű játék? Mit nevezünk rendezett halmaznak és hogyan vezethetjük
      be a "kisebb-nagyobb" fogalmát a természetes számok között? Ebben a részben erről lesz szó...
