prologue:
  - type: narrative
    content: |
      A matematika igazi természete kezdett el kibontakozni az előző részben. Nevezetesen: kiindulunk néhány
      egyszerű állításból, amelyeket igaznak fogadunk el &ndash; ez jelen példánkban a Peano-axiómarendszer 4
      állítása. Nem azért fogadjuk el őket igaznak, mert valamiféle abszolút igazságokat állítanak &ndash; olyan
      talán nem is létezik, ha belegondolunk &ndash;, hanem azért, mert ezek rögzítik a felépítendő elmélet
      "játékszabályait", akárcsak a sakkban. A fogalmainkat szigorúan az axiómákból építjük fel, és csak olyan
      további állításokat fogadunk el igaznak, amelyeket szigorú logikai érveléssel az axiómákra, az azok
      segítségével felépített fogalmakra, vagy korábban már bizonyított állításokra tudunk visszavezetni.
  - type: narrative
    content: |
      Ennek a tudománynak épp ez adja az erősségét is. Minden más természettudomány alapja ugyanis a kísérletezés.
      Akárhány kísérletet is végzünk, soha nem lehetünk teljesen biztosak egy tudományos elmélet igazságában, arra
      csupán megerősítést kapunk. Ha azonban akárcsak egyetlen kísérlet is megcáfolja az elméletünket, azt azonnal
      dobhatjuk ki a kukába. Ezzel szemben egy matematikai állítás igazsága ***örök érvényű***. Egy bizonyított
      állítás igaz marad, ameddig világ a világ, arra nyugodtan lehet tovább építkezni, és nincs szükség arra, hogy
      azt kísérletekkel megerősítsük. Az előző részben például a Peano-axiómák segítségével bevezettük az
      ***összeadás*** fogalmát, és bizonyítottuk annak kommutativitását és asszociativitását. A továbbiakban tehát
      nyugodtan építkezhetünk ezekre a tulajdonságokra.
  - type: narrative
    content: |
      Építkezzünk hát tovább, és kényelmi okok miatt vezessünk be egy újabb műveletet az $\N$ halmazon.
