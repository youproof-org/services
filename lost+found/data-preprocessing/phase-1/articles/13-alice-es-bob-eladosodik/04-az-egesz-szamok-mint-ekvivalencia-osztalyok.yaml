type: section
name: 04-az-egesz-szamok-mint-ekvivalencia-osztalyok
title: Az egész számok, mint ekvivalencia-osztályok

references:
  ekvivalenciarelacio-tulajdonsagai:
    target:
      type: theorem
      name: ekvivalenciarelacio-tulajdonsagai
  termeszetes-szamparok-ekvivalenciarelacioja:
    target:
      type: definition
      name: termeszetes-szamparok-ekvivalenciarelacioja
  termeszetes-szamparok-ekvivalenciarelacioja-szukseges-es-elegseges-feltetel:
