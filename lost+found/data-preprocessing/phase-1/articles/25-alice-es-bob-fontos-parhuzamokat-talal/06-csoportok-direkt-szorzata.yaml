body:
  - type: narrative
    content: |
      A 22. részben a kínai maradéktétel kapcsán került elő egy ***szorzatgyűrűnek*** nevezett konstrukció,
      amelynek a segítségével kettő vagy több gyűrűből egy további gyűrűt lehet képezni. A
      [gyuruk-direkt-szorzata]ben definiáltuk is, hogy pontosan mit értünk szorzatgyűrű alatt, és igazoltuk, hogy
      ez a konstrukció valóban teljesíti a [gyuru-test]ben felsorolt gyűrűaxiómákat. Most egy ehhez nagyon hasonló
      konstrukciót mutatunk be a csoportok esetére is, amelynek szintén a következő részben fogjuk hasznát venni.
