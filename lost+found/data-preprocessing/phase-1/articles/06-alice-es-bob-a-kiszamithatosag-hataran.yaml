epilogue:
  - type: narrative
    content: |
      Ebben a részben megismerkedtünk a Turing-gépnek nevezett elméleti konstrukcióval, amely lényegében az
      "algoritmus" matematikai definíciója, és amellyel döntési és optimalizálási problémákat lehet megoldani. A
      döntési problémákat formális nyelvekkel reprezentáltuk, ahol a Turing-gép feladata felismerni egy adott
      jelsorozatról, hogy egy adott nyelv mondata-e vagy sem. Ennek kapcsán a formális nyelveket az $RE$ és $R$
      nyelvosztályokba soroltuk aszerint, hogy létezik-e a nyelvet felismerő Turing-gép ($RE$ osztály) és ez a
      Turing-gép vajon olyan jelsorozatokra is mindig megáll-e, amelyek nem mondatai a nyelvnek ($R$ osztály). Az
      utóbbi osztályba tartozó nyelveket (és az általuk reprezentált problémákat) tekintjük algoritmikusan
      eldönthető nyelveknek. Az algoritmikus eldönthetőség határait feszegetve mutattunk pár algoritmikusan
      eldönthetetlen problémát, köztük a komoly gyakorlati jelentőséggel bíró megállási problémát és Hilbert híres
      10. problémáját is.
  - type: narrative
    content: |
      A következő részben az algoritmikusan eldönthető problémákat (azaz a rekurzív nyelveket) osztályozzuk tovább
      aszerint, hogy mennyire hatékonyan található meg rájuk az "igen" vagy a "nem" válasz. Ezután már látni
      fogjuk, hogy mit jelent Alice, Bob és Eve számára egy feladat "nehézsége".