prologue:
  - type: narrative
    content: |
      Alice és Bob tehát ott ülnek az RSA-algoritmus 21. részben ismertetett leírása felett, és mindketten
      szeretnének maguknak egy-egy kulcspárt generálni. Ezután ezek publikus részeit megosztják majd egymással, és
      indulhat a biztonságos kommunikáció, azaz mindenki boldog. Igenám, csakhogy a kulcsgenerálási eljárás első
      lépéseként először is mindkettejüknek kellene találnia két-két többszázjegyű prímszámot. Azt a
      [minden-prim-felbonthatatlan] és a [kituntetett-kozos-oszto-letezesenek-kovetkezmenye] következményeként
      tudják, hogy az egész számok $\Z$ gyűrűjében a ***prímszámok*** ([primtulajdonsagu-elem]) és
      ***felbonthatatlan számok*** ([felbonthatatlan-elem]) köre éppenséggel egybeesik. Emiatt a továbbiakban ezt a
      két &ndash; egyébként teljesen különböző &ndash; gyűrűelméleti fogalmat egymás szinonímájaként fogjuk
      használni.
  - type: narrative
    content: |
      A prímszámok keresése szempontjából lényeges kérdés, hogy azok mennyire gyakran fordulnak elő ebben a
      számtartományban. Az úgynevezett ***prímszámláló függvény*** egy olyan függvény, amely azt adja meg bármilyen
      $n$ pozitív egészre, hogy mennyi az $n$-nél nemnagyobb pozitív prímek száma. Ezt a függvényt $\pi$-vel
      jelöljük.
  - type: formula
    lead-in: |
      Az alábbiakban a prímszámláló függvény értékét láthatjuk néhány pozitív egész számra:
    content: |
      \begin{aligned}\pi(1)&=0 \\ \pi(2)&=1 \\ \pi(3)&=2 \\ \pi(3)&=2 \\ \pi(10)&=4 \\ \pi(100)&=25 \\
      \pi(1000000)&=78498 \\ &\vdots \end{aligned}
  - type: figure
    lead-in: |
      Az alábbi ábrán pedig a függvény grafikonja látható az első 60 pozitív egész számra:
    src: 01-primszamlalo-fuggveny.jpg
    alt: Prímszámláló függvény
    caption: Prímszámláló függvény
  - type: narrative
    content: |
      Sajnos a prímszámláló függvényre nincs képletünk, amelybe tetszőleges pozitív egész számot behelyettesítve
      varázslatos módon megkaphatnánk az értékét. Azonban az úgynevezett ***analitikus számelmélet*** egy nevezetes
      tétele szerint ez az érték viszonylag jól becsülhető egy másik, könnyen kiszámítható függvénnyel. Ez ***"nagy
      prímszámtétel"*** néven ismeretes, amelynek részleteire ebben a cikksorozatban nem térünk ki. Ez alapján
      kiszámítható, hogy a 300-600 számjegyből álló számok tartományában &ndash; amelyben Alice és Bob-nak prímeket
      kéne keresnie az RSA-kulcsokhoz &ndash; hogyan alakul a prímek eloszlása. Eszerint ha Alice és Bob teljesen
      véletlenszerűen kisorsol számokat ebből a tartományból, akkor nagyjából minden párszázadik próbálkozásnál
      belebotlanak egy-egy prímszámba.
  - type: narrative
    content: |
      Így már csak az a kérdés, hogy Alice és Bob hogyan tudja gyorsan eldönteni egy konkrét egész számról, hogy
      prím-e vagy sem. Az erre szolgáló algoritmusokat ***prímteszteknek*** nevezzük. A most következő prímtesztelő
      eljárás ismerős lehet az általános iskolából is.
