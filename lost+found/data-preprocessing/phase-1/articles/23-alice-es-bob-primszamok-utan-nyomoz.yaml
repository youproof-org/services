abstract:
  - type: narrative
    content: |
      Az előző részben igazoltuk, hogy az RSA rejtjelezési eljárás valóban minden esetben helyesen működik. Ezt
      alapvetően két fontos számelméleti összefüggés biztosította számunkra. Az első a kis Fermat-tétel
      ([kis-fermat-tetel]), amely a 20. részben ismertetett Euler-Fermat tétel ([euler-fermat-tetel]) következménye
      a prímekre nézve. A másik összefüggés pedig a kínai maradéktétel ([kinai-maradektetel]), amely az úgynevezett
      kongruenciarendszerek megoldhatóságával, illetve a megoldások számával volt kapcsolatos. Végül egyrészt ennek
      következményeként egy &ndash; egyébként a számelmélet más területein is &ndash; rendkívül fontos
      gyűrűizomorfizmussal, másrészt a kis Fermat-tétel egy egyszerű következményével ismerkedtünk meg, amelyek
      együtt lehetővé teszik a kommunikáló felek számára az RSA-dekódolás felgyorsítását.
  - type: narrative
    content: |
      De vajon hogyan képes Alice és Bob az RSA-kulcsgeneráláshoz szükséges többszázjegyű prímszámokat találni?
      Hogyan tudják ezt megtenni anélkül, hogy az idők végezetéig osztáspróbákat kellene végezniük? Mik azok a
      prímtesztek, és pontosan hogyan működnek? Mely számokat nevezzük univerzális álprímeknek, és hogyan tudunk
      megszabadulni tőlük? Ebben a részben erről lesz szó...
