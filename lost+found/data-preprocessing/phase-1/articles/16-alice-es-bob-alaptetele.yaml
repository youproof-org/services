epilogue:
  - type: narrative
    content: |
      Ebben a részben tehát megismerkedtünk a legfontosabb számelméleti fogalommal, azaz az "oszthatósággal",
      illetve annak alapvető tulajdonságaival. Ezután bevezettük az "egység", "asszociált", "felbonthatatlan" és
      "prím" fogalmát, amelyek segítségével a számelmélet alaptételét precízen meg tudtuk fogalmazni. Végül
      szükséges (de nem elégséges) feltételt mutattunk ahhoz, hogy egy integritástartományban teljesülhessen az
      alaptétel.
  - type: narrative
    content: |
      A következő részben ugyanerre egy elégséges (de nem szükséges) feltételt is mutatunk. Ennek keretében gyűrűk
      egy speciális osztályával fogunk megismerkedni, amelyeket euklidészi gyűrűknek nevezünk, és amelyekbe &ndash;
      nagy szerencsénkre &ndash; az egész számok $\Z$ gyűrűje is beletartozik. Itt fogjuk óriási hasznát venni az
      előző részben erre a gyűrűre kiterjesztett $\leq$ szimbólummal jelölt rendezési relációnak.