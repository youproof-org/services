abstract:
  - type: narrative
    content: |
      Az előző részekben (a 11., 12., 13., 14. és 15. részekben) betekintést nyertünk abba a gondolkodásmódba,
      amelyet követve örök érvényű igazságokat tudunk kimondani és bizonyítani a matematikai logika rém egyszerű,
      ám annál szigorúbb szabályainak betartásával. Mindössze 4 állításból, az úgynevezett Peano-axiómákból
      ([peano-axiomarendszer]) indultunk ki, amelyek lényegében a természetes számokról alkotott intuitív
      elképzeléseinket fogalmazzák meg kellő precizitással. Ezekből kiindulva aztán definiáltuk az összeadás és a
      szorzás műveletét e számok között. Ezután e számkört kibővítettük a negatív számokkal, az így kapott halmazt
      pedig $\Z$-vel jelöltük és egész számoknak neveztük el őket. Itt már a kivonás is korlátlanul elvégezhető.
      Végül &ndash; elvonatkoztatva a "szám" fogalmától &ndash; általánosságban is megfogalmaztuk azokat a
      követelményeket, amelyeket egy tetszőleges halmaznak teljesítenie kell annak érdekében, hogy az elemeivel a
      "szokásos" módon "számolni" lehessen. Az ilyen konstrukciókat gyűrűknek neveztük el, amelyeknek számos
      hasznos tulajdonságát mutattuk meg az előző két részben.
  - type: narrative
    content: |
      De vajon mit kezdjünk azzal, hogy az "osztás" művelete általában nem végezhető el gyűrűkben? Mit jelent az
      "oszthatóság"? Mikor mondjuk egy gyűrű valamely elemére, hogy "felbonthatatlan" és mely elemeket nevezzük
      "prímeknek"? Miért van ezeknek kitüntetett szerepük bizonyos gyűrűkben? Mit állít a számelmélet alaptétele,
      és mitől függ, hogy egy gyűrűben teljesül-e vagy nem? Mi a helyzet az egész számok gyűrűjében? Ebben a
      részben erről lesz szó...
