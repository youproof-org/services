epilogue:
  - type: narrative
    content: |
      A következő részekben tovább folytatjuk az egész számok felépítését. Az összeadáshoz hasonlóan a
      Peano-szorzást, valamint a rendezési relációnkat is intuitív módon ki fogjuk terjeszteni erre a számkörre.
      Ezzel teljessé fog válni a természetes számok beágyazása a $\Z$ halmazba. Végül általánosságban is
      megvizsgáljuk, hogy az így kapott új algebrai struktúrával milyen előnyökhöz jutottunk. Ennek keretében
      további absztrakt algebrai fogalmakkal fogunk megismerkedni, amelyeknek majd a prímszámok elméletének
      általánosabb tárgyalásakor vesszük hasznát.