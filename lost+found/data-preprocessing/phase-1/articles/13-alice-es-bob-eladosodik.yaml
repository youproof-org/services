type: chapter
name: 13-alice-es-bob-eladosodik
title: Alice és Bob eladósodik

abstract:
  - type: narrative
    content: |
      Az előző részben tovább folytattuk a számelmélet felépítését a semmiből. A Peano-axiómarendszer és a 11.
      részből már ismert összeadás műveletének segítségével bevezettünk egy második műveletet is az $\N$ halmazon.
      Ezt szorzásnak neveztük el, amelyről megmutattuk, hogy valóban teljesíti mindazon tulajdonságokat, amiket az
      általános iskolában megszokhattunk tőle. Ezután megismerkedtünk a reláció és a rendezett halmaz fogalmával,
      és definiáltunk egy olyan relációt az $\N$ halmazon, amelynek a segítségével egy egyértelmű sorrendet tudtunk
      felállítani e halmaz elemei, azaz a természetes számok között. Megemlítettük ugyanakkor, hogy ez a számkör
      túl szűkös olyan kellőképpen általános számelméleti összefüggések feltárásához, amelyeket a matematika más
      területein is kamatoztatni tudnánk. De vajon mi volt az az absztrakciós folyamat, amelyet őseink is követtek,
      amikor elkezdtek a "semminél kevesebb" mennyiségekről elmélkedni? Mit lehet az ilyen mennyiségekkel
      modellezni? Tulajdonképpen mik azok a negatív számok? Hogyan köthető egy ilyen látszólag értelmetlen fogalom
      a valósághoz? Ebben a részben erről lesz szó...
