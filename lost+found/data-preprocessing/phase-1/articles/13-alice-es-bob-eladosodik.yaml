prologue:
  - type: narrative
    content: |
      Az általános iskolában vélhetően mindenki megtanulta a négy alapműveletet, illetve azok alapvető
      tulajdonságait. Mi ezek közül eddig mindössze ***az összeadással és a szorzással*** ismerkedtünk meg. Ezután
      azonban láthatóan falba ütköztünk, hiszen a természetes számok $\N$ halmazán algebrai értelemben nem
      értelmezhető sem a ***kivonás***, sem pedig az ***osztás***. Ez alatt azt értjük, hogy ezek a
      "művelet-szerűségek" általánosságban kivezetnek a természetes számok köréből. Algebrai értelemben az olyan
      függvényeket neveztük ***műveleteknek***, amelyek $\N$-beli elemekből alkotott párokhoz szintén $\N$-beli
      elemeket rendelnek hozzá. Például a $+$ szimbólummal jelölt művelet egy olyan függvény, amely a $(3;2)$
      párhoz &ndash; és a kommutativitása miatt természetesen a $(2;3)$ párhoz is &ndash; az $5$ szimbólummal
      jelölt $\N$-beli elemet rendeli hozzá.
  - type: narrative
    content: |
      Ilyen értelemben sajnos a szokásos kivonást nem nevezhetjük műveletnek. Az még rendben is lenne, hogy a
      $(3;2)$ párhoz hozzárendeli az $1$ szimbólummal jelölt természetes számot &ndash; hiszen $3-2=1$. De mit
      rendeljen hozzá mondjuk a $(2;3)$ párhoz? Az $\N$ halmazban nincs olyan elem, amely ehhez a párhoz
      rendelhető, mint egy kivonás eredménye. Márpedig a ***művelet*** fogalmának definíciója egyértelműen
      kimondja, hogy egy ilyen függvénynek ***minden*** elempárhoz hozzá kell rendelnie valamilyen elemet az
      alaphalmazból.
  - type: narrative
    content: |
      Megtehetjük persze &ndash; hiszen a matematikában mindent szabad mindaddig, míg a logika egyszerű de annál
      szigorúbb szabályait betartjuk &ndash;, hogy átírjuk a művelet definícióját, és nem kötjük ki, hogy minden
      elempárra értelmezve legyen. Ám ekkor roppant kényelmetlen dolgunk lenne, hiszen bármilyen olyan definíciót,
      tételt vagy bizonyítást, amely a művelet fogalmát használja szintén át kellene fogalmaznunk. Meg kellene
      ugyanis különböztetnünk azokat az eseteket, amelyekben egy művelet értelmezve van egy adott elempárra
      azoktól, amelyekben nincs. Nem állítom, hogy ez lehetetlen lenne, de semmiképpen sem kényelmes.
  - type: narrative
    content: |
      A matematikusok alapvetően lusták, ezért ilyen esetekben rendszeresen az általánosítás és az absztrakció
      eszközéhez nyúlnak. Ez azt jelenti, hogy olyan általánosabb fogalmakat és elméleteket dolgoznak ki,
      amelyekben az adott probléma sokkal kényelmesebben kezelhető. Mi is ezt az utat fogjuk követni. A problémánk
      tehát az, hogy a természetes számok között általánosságban nem végezhető el a kivonás. Az ezen a halmazon
      ugyanis nem művelet. Ezért ebben és a következő részben át fogunk térni egy másik számhalmazra, amelyben ez a
      probléma egy csapásra megszűnik. Ezt azonban nem a szokásos módon fogjuk megtenni, hanem továbbra is
      szigorúan az eddig felépített fogalmainkra, tételeinkre, valamint a Peano-axiómarendszerre támaszkodva. Így
      válik ugyanis világossá, hogy a korai gondolkodók számára mennyire nem volt magától értetődő absztrakció a
      számegyenes 0-tól balra lévő részének felfedezése (vagy megalkotása?).
  - type: narrative
    content: |
      Az eddigiekhez hasonlóan tehát töröljünk most ki mindent a fejünkből, amit a negatív számokról tudunk.
      Számunkra most kizárólag a természetes számok $\N$ halmaza létezik a rajta értelmezett két művelettel és az
      előző részben megismert rendezési relációval.
