type: section
name: 06-az-osszeadas-kommutativitasa
title: Az összeadás kommutativitása

references:
  peano-osszeadas:
    target:
      type: definition
      name: peano-osszeadas
  peano-osszeadas-kommutativitas-0-lemma:
    target:
