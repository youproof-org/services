type: theorem
name: nem-miller-rabin-tanuk-es-nem-fermat-tanuk-viszonya-nem-primhatvanyok-eseten
proofs:
  - nem-miller-rabin-tanuk-es-nem-fermat-tanuk-viszonya-nem-primhatvanyok-eseten-bizonyitas
remarks: []
references:
  nem-miller-rabin-tanuk-csoportja-nem-primhatvanyok-eseten:
    target:
      type: theorem
      name: nem-miller-rabin-tanuk-csoportja-nem-primhatvanyok-eseten
content:
  - type: narrative
    content: |
      Legyen $n$ egy tetszőleges ***$1$-nél nagyobb páratlan szám***, amelynek legalább két egymástól különböző
      prímtényezője is van, azaz ***nem prímhatvány***.
  - type: formula
    lead-in: |
      Képezzük azt az $e\geq 1$ kitevőt és $k\geq 1$ páratlan számot, amelyekre teljesül az alábbi:
    content: |
      n-1=2^ek
  - type: narrative
    content: |
      A [nem-miller-rabin-tanuk-csoportja-nem-primhatvanyok-eseten] szövegével megegyező módon legyen
      $j_{\text{max}}$ a ***legnagyobb*** olyan $j$ kitevő a $\{0;1;2;\ldots;e-1\}$ egész számok között, amelyhez
      léteznek olyan $x$ egész számok, hogy teljesül az $x^{2^j}\equiv -1\pmod n$ kongruencia. ***Megjegyzés:*** Az
      említett [nem-miller-rabin-tanuk-csoportja-nem-primhatvanyok-eseten] alapján legalább egy ilyen $j$ kitevő
      biztosan létezik, tehát $j_{\text{max}}$ is létezik.
  - type: formula
    lead-in: |
      Ugyancsak a [nem-miller-rabin-tanuk-csoportja-nem-primhatvanyok-eseten] szövegével megegyezően jelöljük
      $H_n$-nel azon $[a]_n$ maradékosztályok halmazát, amelyek esetén az $a^{2^{j_{\text{max}}}k}$ hatvány
      $1$-gyel ***vagy*** $-1$-gyel kongruens modulo $n$, azaz:
    content: |
      a^{2^{j_{\text{max}}}k} \equiv \pm 1\pmod n
  - type: narrative
    content: |
      Végül jelöljük $F_n$-nel azokat a modulo $n$ maradékosztályokat, amelyek ***nem Fermat-tanúi*** $n$-nek.
  - type: ordered-list
    lead-in: |
      Ekkor $H_n$-hez hasonlóan $F_n$ is részcsoportot alkot a $(\Z/n\Z)^{\times}$ multiplikatív csoportban,
      valamint teljesülnek az alábbiak:
    items:
      - 'Ha $n$ nem Carmichael-szám, akkor $H_n\lt F_n\lt (\Z/n\Z)^{\times}$'
      - 'Ha $n$ Carmichael-szám, akkor $H_n\lt F_n=(\Z/n\Z)^{\times}$.'
  - type: narrative
    content: |
      ***Szavakkal ez így fogalmazható meg:*** $H_n$ ***valódi részcsoport*** $F_n$-ben, amely viszont akkor és
      csak akkor ***valódi részcsoport*** $(\Z/n\Z)^{\times}$-ben, ha $n$ nem Carmichael-szám (egyébként megegyezik
      vele).