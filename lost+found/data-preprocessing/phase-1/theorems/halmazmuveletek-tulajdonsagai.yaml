type: theorem
name: halmazmuveletek-tulajdonsagai
proofs:
  - halmazmuveletek-tulajdonsagai-bizonyitas
remarks: []
references:
  neutralis-elem:
    target:
      type: definition
      name: neutralis-elem
content:
  - type: narrative
    content: |
      Legyenek $A$, $B$ és $C$ tetszőleges halmazok, valamint jelölje $U$ az univerzális, $\empty$ pedig az üres
      halmazt.
  - type: ordered-list
    lead-in: |
      Ekkor teljesülnek az alábbiak:
    items:
      - 'Az ***üres halmaz*** az unióképzés, az ***univerzális halmaz*** pedig a metszetképzés műveletére nézve
        ***neutrális elem*** (lásd a [neutralis-elem]t), azaz $A\cup \empty=A$ és
        $A\cap U=A$.'
      - 'Mindkét műveletre teljesül az úgynevezet ***idempotencia***, azaz $A\cup A=A$ és $A\cap A=A$.'
      - 'Mindkét művelet ***kommutatív***, azaz $A\cup B=B\cup A$ és $A\cap B=B\cap A$.'
      - 'Mindkét művelet ***asszociatív***, azaz $(A\cup B)\cup C=A\cup (B\cup C)$ és $(A\cap B)\cap C=A\cap
        (B\cap C)$.'
      - 'A két művelet ***kölcsönösen disztributív egymásra nézve***, azaz $A\cup (B\cap C)=(A\cup B)\cap (A\cup
        C)$ és $A\cap (B\cup C)=(A\cap B)\cup (A\cap C)$.'
      - 'Mindkét műveletre teljesül az úgynevezett ***elnyelési tulajdonság (abszorptivitás)***, azaz $A\cup
        (A\cap B)=A$ és $A\cap (A\cup B)=A$.'
      - 'Az üres halmaz és az univerzális halmaz ***egymás komplementerei***, azaz $\overline{\empty}=U$ és
        $\overline{U}=\empty$.'
      - 'A ***komplementerképzést duplán elvégezve*** az eredeti halmazt kapjuk vissza, azaz
        $\overline{\overline{A}}=A$.'
      - 'Egy ***halmaz és komplementerének uniója*** az univerzális halmaz, ***metszetük*** pedig az üres halmaz,
        azaz $A\cup \overline{A}=U$ és $A\cap \overline{A}=\empty$.'
      - 'Teljesülnek az úgynevezett ***de Morgan-azonosságok***, azaz $\overline{A\cup B}=\overline{A}\cap
        \overline{B}$ és $\overline{A\cap B}=\overline{A}\cup \overline{B}$.'
