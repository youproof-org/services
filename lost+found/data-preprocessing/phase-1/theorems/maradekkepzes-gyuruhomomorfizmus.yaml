content:
  - type: narrative
    content: |
      Tegyük fel, hogy $m\eq 0$ egy tetszőleges nemnulla egész szám. Ekkor a [modularis-osszeadas-es-szorzas]ban
      szereplő $\bmod_m:\Z \to Z_m$ ***maradékképző függvény egy szürjektív gyűrűhomomorfizmus*** $\Z$ és $Z_m$
      között.
