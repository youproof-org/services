type: theorem
name: kituntetett-kozos-oszto-egyertelmusege
proofs:
  - kituntetett-kozos-oszto-egyertelmusege-bizonyitas
remarks: []
content:
  - type: narrative
    content: |
      Ha egy $R$ integritástartományban valamely $a$ és $b$ elemeknek létezik kitüntetett közös osztója, akkor az
      ***asszociáltságtól eltekintve egyértelmű***.
  - type: narrative
    content: |
      Ezalatt egyrészt azt értjük, hogy egy kitüntetett közös osztó bármely asszociáltja is kitüntetett közös
      osztó, másrészt pedig azt, hogy bármely két kitüntetett közös osztó szükségképpen egymás asszociáltja.