type: theorem
name: bezout-lemma-euklideszi-gyurukben
proofs:
  - bezout-lemma-euklideszi-gyurukben-bizonyitas-1
  - bezout-lemma-euklideszi-gyurukben-bizonyitas-2
remarks: []
references:
  euklideszi-gyuru:
    target:
      type: definition
      name: euklideszi-gyuru
content:
  - type: narrative
    content: |
      Legyen $R$ ***euklidészi gyűrű*** (lásd a [euklideszi-gyuru]t), továbbá legyenek $a$ és $b$ az $R$
      tetszőleges elemei. Ekkor az $(a,b)$ kitüntetett közös osztó kifejezhető $(a,b)=au+bv$ alakban az $R$ gyűrű
      alkalmasan választott $u$ és $v$ elemeinek segítségével. Ezt az összeget az $a$ és $b$ elemek $u$ és $v$
      elemekkel vett ***lineáris kombinációjának*** nevezzük.