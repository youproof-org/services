content:
  - type: unordered-list
    lead-in: |
      E tétel megfogalmazásához az alábbi jelöléseket használjuk:
    items:
      - '$\N_1$-gyel a Peano-axiómarendszer ([peano-axiomarendszer]) szerint
        definiált halmazt jelöljük.'
      - 'Az egész számokra a [egesz-szamok-halmaza] szerinti jelölést alkalmazzuk.'
      - 'A $\Z$ halmazon értelmezett [egesz-szamok-rendezese] szerinti teljes
        rendezést a $\lesssim$, az $\N_1$ halmazon értelmezett [termeszetes-szamok-rendezese] szerinti teljes rendezést pedig a $\leq$ szimbólummal jelöljük.'
      - 'A $\Z$ halmazon értelmezett [egesz-szamok-osszeadasa] szerinti összeadást
        a $\oplus$, az $\N_1$ halmazon értelmezett [peano-osszeadas] szerinti
        Peano-összeadást pedig a $+$ szimbólummal jelöljük.'
  - type: formula
    lead-in: |
      Tegyük fel, hogy adva van egy $f:\N_1 \to \Z$ függvény az alábbiak szerint:
    content: |
      f(n)=[(n;0)]
  - type: narrative
    content: |
      Ekkor az $\N_1$ halmaz tetszőleges $a$ és $b$ elemeire igaz, hogy $a\leq b$ ***pontosan akkor*** teljesül, ha
      $f(a)\lesssim f(b)$ is teljesül. Más szavakkal $f$ egy ***injektív homomorfizmus*** az $(\N_1, \leq)$ és a
      $(\Z ,\lesssim )$ teljesen rendezett halmazok, mint algebrai struktúrák között.