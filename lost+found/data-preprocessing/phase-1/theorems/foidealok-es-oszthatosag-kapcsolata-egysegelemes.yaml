type: theorem
name: foidealok-es-oszthatosag-kapcsolata-egysegelemes
proofs:
  - foidealok-es-oszthatosag-kapcsolata-egysegelemes-bizonyitas
remarks: []
content:
  - type: narrative
    content: |
      Legyen $R$ tetszőleges ***kommutatív és egységelemes*** gyűrű, valamint legyenek $a\eq 0$ és $b$ az $R$
      tetszőleges elemei.
  - type: ordered-list
    lead-in: |
      Ekkor teljesülnek az alábbiak:
    items:
      - 'Az $a|b$ oszthatóság ***akkor és csak akkor*** teljesül, ha teljesül a $(b)\sube (a)$ ***tartalmazási
        reláció***.'
      - 'Az $(a)=(b)$ egyenlőség ***akkor és csak akkor*** teljesül, ha $a$ és $b$ ***asszociáltak***, azaz $a\sim
        b$.'
