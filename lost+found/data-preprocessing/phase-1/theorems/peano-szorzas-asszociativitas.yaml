type: theorem
name: peano-szorzas-asszociativitas
proofs:
  - peano-szorzas-asszociativitas-bizonyitas
remarks: []
content:
  - type: formula
    lead-in: |
      Az $\N$ halmaz tetszőleges $a$, $b$ és $c$ elemeire igaz az alábbi összefüggés:
    content: |
      (a\cdot b)\cdot c = a\cdot (b\cdot c)