remarks: []
content:
  - type: narrative
    content: |
      Legyen $m\gt 0$ tetszőleges ***pozitív*** egész szám. Ekkor az Euler-féle $\varphi$-függvény a $0$, $1$, $2$,
      ..., $m-1$ egész számok közül az ***$m$-hez relatív prímek számát*** adja meg.