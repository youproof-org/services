    content: |
      Az egész számok $(\Z ,+,\cdot )$ gyűrűjének alaphalmazán ***pontosan egy*** olyan ***teljes rendezés***
      létezik, amelyre teljesülnek a [rendezett-gyuru]ban megfogalmazott ***rendezési axiómák***. Ennek a
      rendezésnek a pozitivitástartománya épp a [pozitiv-es-negativ-egesz-szamok] szerinti pozitív,
      negativitástartománya pedig az ugyanezen definíció szerinti negatív egész számokból áll.