epilogue:
  - type: narrative
    content: |
      Ebben a részben tehát végérvényesen lezártuk a számelmélet alaptételének kérdését azáltal, hogy egyszerre
      szükséges és elégséges feltételrendszert mutattunk a teljesülésére. Ehhez egy rövid halmazelméleti
      gyorstalpaló után az ideálok elméletének néhány alapvető összefüggésével ismerkedtünk meg. Végül bevezettük
      az euklidészi gyűrűknél általánosabb főideálgyűrűk fogalmát, és igazoltuk, hogy ezekben is mindig teljesül az
      alaptétel.
  - type: narrative
    content: |
      A következő részekben elsősorban a főideálgyűrűk &ndash; és speciálisan az egész számok $\Z$ gyűrűjének
      &ndash; ideáljaival, valamint az ezek szerinti kongruenciákkal és faktorgyűrűkkel fogunk foglalkozni. Ennek
      során az RSA-algoritmus és a különböző prímtesztelő eljárások számelméleti összetevőivel ismerkedünk meg.