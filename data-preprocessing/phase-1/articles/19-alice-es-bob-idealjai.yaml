abstract:
  - type: narrative
    content: |
      Az előző részben megvizsgáltuk, hogyan kell osztási maradékokkal műveleteket végezni. Ezeket a műveleteket
      moduláris összeadásnak és moduláris szorzásnak neveztük, és igazoltuk, hogy az osztási maradékok halmaza
      ezzel a két művelettel gyűrűt alkot. Ennek során megmutattuk a 9. részben ismertetett Diffie-Hellman
      kulcscsere protokoll helyességét. Ezután általánosságban is megvizsgáltuk a gyűrűk közötti művelettartó
      leképezések, azaz a gyűrűhomomorfizmusok tulajdonságait. Ez adta a motivációt a kongruencia fogalmának
      bevezetéséhez. Megmutattuk, hogy a kongruencia nem függ egy konkrét $f$ gyűrűhomomorfizmustól, hanem csak
      azoktól az elemektől, amelyekhez $f$ a célgyűrű nullelemét rendeli hozzá. Ezt a részhalmazt $f$ magjának
      neveztük. Ezzel párhuzamosan definiáltuk az ideál fogalmát, és megmutattuk, hogy egy gyűrűben pontosan az
      ideálok lehetnek gyűrűhomomorfizmusok magjai. Ehhez meg kellett ismerkednünk a maradékosztálygyűrű (vagy
      faktorgyűrű) fogalmával. Végül egy egyszerű következményként adódott az úgynevezett homomorfizmustétel.
  - type: narrative
    content: |
      De vajon hogyan néznek ki az egész számok gyűrűjének ideáljai? Mi a kapcsolat az ideálok és a 16. részben
      bevezetett oszthatósági alapfogalmak között? Mik azok a főideálgyűrűk, és ezeknek milyen jó tulajdonságaik
      vannak? Mi közük az euklidészi gyűrűkhöz? Hogyan zárható le a számelmélet alaptételének kérdése végérvényesen
      az ideálok segítségével? Ebben a részben erről lesz szó...
