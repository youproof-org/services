prologue:
  - type: narrative
    content: |
      Az oszthatósági alapfogalmak kapcsán a 16. részben ismerkedtünk meg a felbonthatatlan (vagy prím-) számokkal,
      és láttuk, hogy ezek bizonyos értelemben az építőkövek szerepét töltik be a számok között. A 17. részben
      ugyanis igazoltuk, hogy egyrészt minden egész szám előállítható prímszámok szorzataként, másrészt pedig azt,
      hogy ez lényegében csak egyféleképpen tehető meg. Ezt a két állítást &ndash; tehát a prímtényezős felbontás
      ***létezését*** és ***egyértelműségét*** &ndash; együttesen a ***számelmélet alaptételének*** neveztük. Mi
      azonban nem kimondottan az egész számok körében, hanem ennél általánosabban, a gyűrűk &ndash; pontosabban az
      integritástartományok &ndash; absztrakciós szintjén vizsgáltuk a kérdést. Ezen a szinten általánosságban már
      különválik a felbonthatatlan ([felbonthatatlan-elem]) és a prím fogalma ([primtulajdonsagu-elem]). Láttuk,
      hogy a számelmélet alaptétele bizony nem teljesül minden integritástartományban, ezért megpróbáltuk
      meghatározni ennek feltételeit. Először ismételjük át ennek főbb lépéseit.
  - type: narrative
    content: |
      A keresett feltételek megtalálása mindeddig felemásan sikerült. Elsőként a
      [szamelmelet-alaptetele-nem-egysegelemes-integritastartomanyokban] és a
      [szamelmelet-alaptetelenek-szukseges-feltetele] fogalmazott meg egy-egy szükséges feltételt. E két tétel
      alapján a számelmélet alaptétele csak ***egységelemes*** integritástartományokban teljesülhet, és azok közül
      is csak azokban, amelyekben ***minden felbonthatatlan elem prímtulajdonságú***. Itt egyrészt megemlítettük,
      hogy ez a két feltétel ***szükséges ugyan, de önmagában még nem elégséges*** az alaptételhez. Másrészt
      viszont azt is megemlítettük, hogy "nem hiányzik sok", mivel a második feltétel az alaptétel egyértelműségi
      állításához már elégséges (azaz a prímtényezős felbontás létezését ugyan nem garantálja, ám ha az mégis
      létezik, akkor egyértelmű).
  - type: narrative
    content: |
      Ezután a 17. részben megismerkedtünk az úgynevezett ***euklidészi gyűrűkkel*** ([euklideszi-gyuru]),
      amelyekben bizonyos absztrakt értelemben elvégezhető a ***maradékos osztás***. Ennek két fontos következménye
      volt. Egyrészt a [euklideszi-gyuruben-letezik-kituntetett-kozos-oszto] értelmében bármely két elemnek létezik
      a ***kitüntetett közös osztója*** ([kituntetett-kozos-oszto]), amelyből a
      [kituntetett-kozos-oszto-letezesenek-kovetkezmenye] alapján következik, hogy ***minden felbonthatatlan elem
      prímtulajdonságú*** (azaz az alaptétel ***egyértelműségi*** állítása).
  - type: narrative
    content: |
      Másrészt viszont a [euklideszi-norma-egyenlotlensegi-tulajdonsaga] és a
      [euklideszi-norma-szigoru-egyenlotlensegenek-feltetele] alapján ha egy integritástartományon létezik
      ***bármilyen*** euklidészi norma, akkor létezik olyan is, amely szigorúan nagyobb értéket ad bármilyen
      kéttényezős szorzatra, mint a tényezőkre külön-külön (kivéve ha valamelyik tényező egység, amikoris
      egyenlőség áll fenn). Ebből a [euklideszi-gyurukben-teljesul-a-szamelmelet-alaptetele] alapján már viszonylag
      egyszerűen következik a ***prímtényezős felbontás létezéséről*** szóló állítás.
  - type: narrative
    content: |
      A maradékos osztás elvégezhetősége tehát egy ***elégséges feltétel*** az alaptétel tejesüléséhez,
      megemlítettük ***ugyanakkor***, hogy sajnos ***nem szükséges***. Léteznek ugyanis olyan
      integritástartományok, amelyek nem euklidészi gyűrűk, mégis teljesül bennük az alaptétel. Van már tehát
      ***szükséges (de nem elégséges)***, és ***elégséges (de nem szükséges)*** feltételünk. Jó volna mostmár
      végleg lezárni ezt a kérdést, és találni egy olyan feltételrendszert, amely egyszerre ***szükséges és
      elégséges*** is. Szerencsére az előző részben bevezetett ***ideálok*** segítségével ebben a részben képesek
      leszünk megfogalmazni egy ilyen feltételrendszert.
  - type: narrative
    content: |
      Ez szoros összefüggésben fog állni bizonyos ideálok egymáshoz való viszonyával. Minthogy egy gyűrű ideáljai
      tulajdonképpen halmazok, ezért nem árt először megismerkedni néhány halmazokkal kapcsolatos alapfogalommal és
      jelöléssel.
