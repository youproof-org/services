body:
  - type: narrative
    content: |
      Így mostmár minden rendelkezésünkre áll a Miller-Rabin-tanúk számára vonatkozó, a
      [miller-rabin-tanuk-szama]ben igazolt eredeti becslésünk javításához. Foglaljuk is össze ezeket az
      eredményeket. Megjegyezzük, hogy az alábbi becsléshez némileg szűkíteni kell a kört a $9$-nél nagyobb
      páratlan összetett számokra, ám ez nyilvánvalóan nem jelent gyakorlati megszorítást, tekintve, hogy
      Miller-Rabin-prímtesztet ennél jóval nagyobb számtartományban használják.
