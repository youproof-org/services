type: proof
name: polinomok-osszegenek-es-szorzatanak-polinomfuggvenye-bizonyitas
remarks: []
references:
  fuggvenyek-kozotti-muveletek:
    target:
      type: definition
      name: fuggvenyek-kozotti-muveletek
  polinomfuggveny:
    target:
      type: definition
      name: polinomfuggveny
  polinomok:
    target:
      type: definition
      name: polinomok
content:
  - type: formula
    lead-in: |
      A továbbiakban reprezentáljuk az $f$ és $g$ polinomokat az alábbi végtelen sorozatokkal, ahol $0_R$ jelöli az
      $R$ gyűrű nullelemét:
    content: |
      \begin{aligned}f&=(a_0,a_1,a_2,\ldots, a_n,0_R,0_R,0_R,\ldots) \\ g&=(b_0,b_1,b_2,\ldots,
      b_m,0_R,0_R,0_R,\ldots)\end{aligned}
  - type: formula
    lead-in: |
      A [polinomok] szerint e két polinom ***összegének*** $k$-adik tagját az alábbi képletből kapjuk:
    content: |
      c_k=a_k+b_k
  - type: formula
    lead-in: |
      Szintén a [polinomok] alapján a két polinom ***szorzatának*** $k$-adik tagját pedig az alábbi képlet
      szolgáltatja:
    content: |
      c_k=a_0b_k+a_1b_{k-1}+a_2b_{k-2}+\ldots+a_kb_0
  - type: narrative
    content: |
      Az általánosság megsértése nélkül feltételezhetjük, hogy $m=n$. Ha ugyanis például $m\leq n$ lenne a helyzet,
      akkor a $g$ polinom tagjait az $m+1$-edik indextől kezdve, ha pedig $m\geq n$, akkor meg az $f$ polinom
      tagjait az $n+1$-edik indextől kezdve $0_R$-nek választva érvényes marad az alábbi gondolatmenet.
  - type: formula
    lead-in: |
      Ezek fényében a két polinomhoz tartozó polinomfüggények a [polinomfuggveny] alapján minden $x\in R$
      gyűrűelemhez az alábbi kifejezések eredményét rendelik hozzá:
    content: |
      \begin{aligned}F(x)&=a_0+a_1x+a_2x^2+\ldots+a_nx^n \\ G(x)&=b_0+b_1x+b_2x^2+\ldots+b_nx^n\end{aligned}
  - type: formula
    lead-in: |
      E két polinomfüggvény ***pontonkénti összege*** a [fuggvenyek-kozotti-muveletek] értelmében az alábbi lesz
      (miután a tagok sorrendjét az $x$ hatványai szerint sorbarendeztük és csoportosítottuk):
    content: |
      (F+G)(x)=(a_0+b_0) + (a_1+b_1)x + (a_2+b_2)x^2 + \ldots + (a_n+b_n)x^n
  - type: narrative
    content: |
      Látható, hogy itt tetszőleges $k$ esetén az $x^k$ tag együtthatója $a_k+b_k$ alakban írható fel, vagyis ez a
      ***pontonkénti összegfüggvény*** a [polinomfuggveny] értelmében valóban az $f+g$ ***összegpolinomhoz tartozó
      polinomfüggvény*** lesz.
  - type: formula
    lead-in: |
      A két polinomfüggvény ***pontonkénti szorzatának*** kiszámításához az alábbi zárójeles kifejezést kell
      felbontani:
    content: |
      \begin{aligned}(F\cdot G)(x)=&(a_0+a_1x+a_2x^2+\ldots+a_nx^n)\cdot \\ \cdot
      &(b_0+b_1x+b_2x^2+\ldots+b_nx^n)\end{aligned}
  - type: formula
    lead-in: |
      Ha most minden tagot minden taggal megszorzunk, akkor tetszőleges $k$ esetén az $x^k$ tag együtthatója
      azoknak az $a_ib_j$ szorzatoknak az összege lesz, ahol $i+j=k$, azaz:
    content: |
      a_0b_k+a_1b_{k-1}+a_2b_{k-2}+\ldots+a_kb_0
  - type: narrative
    content: |
      Vagyis ez a ***pontonkénti szorzatfüggvény*** a [polinomfuggveny] értelmében valóban az $f\cdot g$
      ***szorzatpolinomhoz tartozó polinomfüggvény*** lesz.