packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'
  - 'infra/cloudflare/worker'
  - 'infra/cloudflare/newsletter-worker'

# Common version catalog — single, authoritative source of truth for shared
# third-party dependency versions. Exact-pinned by design: the catalog is the
# bill of materials, reproducibility comes from pnpm-lock.yaml, and bumps stay
# explicit/reviewable (automate with Renovate/Dependabot).
catalog:
  # runtime
  '@fortawesome/fontawesome-svg-core': 7.2.0
  '@fortawesome/free-brands-svg-icons': 7.2.0
  '@fortawesome/free-solid-svg-icons': 7.2.0
  '@fortawesome/react-fontawesome': 3.2.0
  js-yaml: 4.1.1
  katex: 0.16.38
  next: 15.5.12
  opentype.js: 1.3.4
  react: 19.2.4
  react-dom: 19.2.4
  sharp: 0.35.3
  # dev / build
  '@cloudflare/workers-types': 4.20260630.1
  ajv: 8.20.0
  esbuild: 0.28.1
  '@types/js-yaml': 4.0.9
  '@types/node': 24.13.2
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3
  chokidar: 5.0.0
  postcss: 8.5.8
  sass: 1.98.0
  typescript: 5.9.3
  wrangler: 4.114.0
