# Reusable full-site deploy for one (environment, services_sha, content_sha).
#
# This is the single source of truth for an APPLY-time deploy. It is called by:
#   - deploy-to-cloudflare.yml  (push to a stable branch OR a content dispatch)
#   - rollback.yml              (redeploy the last known-good pair)
#
# A deployable version is the pair (services_sha, content_sha). The caller passes
# git refs (branch names for a normal deploy — so we always build the LATEST of
# both sides — or exact SHAs for a rollback). `resolve` pins them to concrete
# SHAs once, and every downstream job checks out those exact SHAs so the whole
# run is deterministic even if a branch tip moves mid-run.
#
# Job graph (see `needs:`):
#   resolve
#     -> zone (production only; shared root owning BOTH the youproof.hu and youproof.org zones)
#          -> website-infra (per-env R2 buckets + custom domain in the youproof.org zone)
#               -> worker (regenerate manifest from content, redeploy the .hu worker)
#                    -> website (Next.js static export -> R2 content bucket -> CDN purge)
#                         -> quality-gate (crawler-based gate against the .org host)
#                              -> rollback-dispatch (production, on gate failure)
#
# Env is derived from `inputs.environment`; secrets are scoped via GitHub
# Environments exactly like the existing worker job, so a staging run can never
# see production values and vice versa.
name: deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment: staging | production."
        required: true
        type: string
      services_ref:
        description: "services git ref (branch for a normal deploy, SHA for rollback)."
        required: true
        type: string
      content_ref:
        description: "content git ref (branch for a normal deploy, SHA for rollback)."
        required: true
        type: string
      is_rollback:
        description: >-
          True when this deploy IS a rollback redeploy. Suppresses the
          auto-rollback-on-failure dispatch (so a failed rollback can't loop) and
          emits a distinct ::error:: if the gate fails again.
        required: false
        type: boolean
        default: false
    # secrets: inherit is used by callers, so every `secrets.*` below resolves.

concurrency:
  # One deploy per environment at a time (a rollback of the same env queues
  # behind the deploy that triggered it — cancel-in-progress would abandon a
  # half-applied deploy).
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Pin the (services, content) refs to concrete SHAs, once, for the whole run.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      services_sha: ${{ steps.svc.outputs.sha }}
      content_sha: ${{ steps.content.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.services_ref }}
      - name: Resolve services SHA
        id: svc
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resolve content SHA (private content repo)
        id: content
        env:
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          CONTENT_REF: ${{ inputs.content_ref }}
        run: |
          git clone --quiet \
            "https://x-access-token:${CONTENT_REPO_TOKEN}@github.com/youproof-org/content.git" \
            "$RUNNER_TEMP/content"
          git -C "$RUNNER_TEMP/content" checkout --quiet "$CONTENT_REF"
          echo "sha=$(git -C "$RUNNER_TEMP/content" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Shared zone root: owns BOTH the youproof.hu and youproof.org zones and their
  # zone-level singletons (settings, www redirects, and the youproof.org .html
  # transform + cache rules). Applied only for PRODUCTION, because it owns
  # account-level infra shared by both environments (staging deploys never touch
  # it). Idempotent apply.
  zone:
    needs: resolve
    if: inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_WORKDIR: infra/cloudflare/terraform/zone
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Default locale for the youproof.org apex root redirect ('/' -> '/<locale>').
      # Sourced from the GitHub Environment var; must match DEFAULT_LOCALE in
      # apps/website/lib/i18n/locales.json. Falls back to 'hu' if the var is unset.
      TF_VAR_default_locale: ${{ vars.DEFAULT_LOCALE || 'hu' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.services_sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
      - name: Terraform init (R2 backend, zone state key)
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.R2_STATE_BUCKET }}" \
            -backend-config="key=cloudflare/zone.tfstate" \
            -backend-config="endpoints={s3=\"https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com\"}" \
            -backend-config="access_key=${AWS_ACCESS_KEY_ID}" \
            -backend-config="secret_key=${AWS_SECRET_ACCESS_KEY}"
      - name: Terraform format check
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform fmt -check -recursive
      - name: Terraform plan
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform plan -input=false -out=tfplan
      - name: Terraform apply
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform apply -input=false -auto-approve tfplan

  # Per-environment website (CDN) infra: R2 content + test-artifacts buckets and
  # the R2 custom domain fronting the content bucket, in the youproof.org zone.
  # Reads the shared zone root's remote state for the org zone ID
  # (website/data.tf), so the zone root must exist first. A skipped zone job
  # (staging path) still satisfies `needs` — the state was applied by an earlier
  # production run / the bootstrap apply.
  website-infra:
    needs: [resolve, zone]
    # zone is SKIPPED on staging (it only applies for production). A skipped
    # dependency would skip this job by default, so gate explicitly: run when
    # resolve succeeded and zone either succeeded (production) or was skipped
    # (staging) — but not when zone failed.
    if: >-
      !cancelled() && needs.resolve.result == 'success' &&
      (needs.zone.result == 'success' || needs.zone.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Expose the youproof.org zone id (read from the shared zone root's
    # remote-state `org_zone_id` output via website/data.tf) so the `website` job
    # can scope its CDN cache purge without a separate GitHub variable.
    outputs:
      org_zone_id: ${{ steps.tfout.outputs.org_zone_id }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      TF_WORKDIR: infra/cloudflare/terraform/website
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_tfstate_bucket: ${{ vars.R2_STATE_BUCKET }}
      # Search-engine domain verification for the apex. Production-only: these records
      # prove ownership of the ZONE, not of one environment's host, so exactly one
      # state may manage them — the vars are simply unset on the staging Environment
      # and the resources are count-gated off there. Vars rather than secrets: both
      # values are published in public DNS the moment they apply.
      TF_VAR_google_site_verification: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      TF_VAR_bing_site_verification: ${{ vars.BING_SITE_VERIFICATION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.services_sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
      - name: Terraform init (R2 backend, per-environment website state key)
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.R2_STATE_BUCKET }}" \
            -backend-config="key=cloudflare/website/${ENVIRONMENT}.tfstate" \
            -backend-config="endpoints={s3=\"https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com\"}" \
            -backend-config="access_key=${AWS_ACCESS_KEY_ID}" \
            -backend-config="secret_key=${AWS_SECRET_ACCESS_KEY}"
      - name: Terraform format check
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform fmt -check -recursive
      - name: Terraform plan
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform plan -input=false -out=tfplan
      - name: Terraform apply
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform apply -input=false -auto-approve tfplan
      - name: Export org zone id (from the zone root's remote-state output)
        id: tfout
        working-directory: ${{ env.TF_WORKDIR }}
        run: echo "org_zone_id=$(terraform output -raw org_zone_id)" >> "$GITHUB_OUTPUT"

  # .hu migration worker: regenerate its redirect manifest from the CURRENT
  # content YAML, then redeploy (terraform/worker/). This is the content-aware
  # evolution of the old standalone `worker` job — the manifest is no longer the
  # committed empty stub, it is generated from content at deploy time. The
  # existing .hu redirect smoke tests still run here (post-migration validation
  # of the .hu side), unchanged.
  worker:
    needs: [resolve, website-infra]
    # Explicit skip-tolerant gate: on staging the `zone` job is skipped, and the
    # default `if: success()` treats a skipped TRANSITIVE ancestor (zone, via
    # website-infra) as non-success — which would wrongly skip this whole chain.
    # `!cancelled()` + explicit result checks run it whenever its real
    # dependencies succeeded, regardless of the skipped zone (mirrors
    # website-infra's guard). Same pattern on website/quality-gate below.
    if: >-
      !cancelled() && needs.resolve.result == 'success' &&
      needs.website-infra.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      TF_WORKDIR: infra/cloudflare/terraform/worker
      CONTENT_DIR: ${{ github.workspace }}/content-repo/content
      # Target .org locale this legacy domain's paths map to (youproof.hu -> hu).
      # Consumed by gen-manifest.mjs to build /{locale}/{container}/{slug} targets
      # from the shared apps/website/lib/i18n/locales.json dictionary.
      LOCALE: ${{ vars.WORKER_LOCALE || 'hu' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_tfstate_bucket: ${{ vars.R2_STATE_BUCKET }}
      TF_VAR_worker_domain: ${{ vars.WORKER_DOMAIN }}
      TF_VAR_redirect_target_host: ${{ vars.REDIRECT_TARGET_HOST }}
      TF_VAR_legacy_proxy_host: ${{ vars.LEGACY_PROXY_HOST }}
      TF_VAR_rackhost_server_ip: ${{ vars.RACKHOST_SERVER_IP }}
      TF_VAR_production_cutover: ${{ vars.PRODUCTION_CUTOVER || 'false' }}
      TF_VAR_legacy_guard_value: ${{ vars.LEGACY_GUARD_VALUE }}
      # Derived from the environment: noindex the legacy proxy everywhere EXCEPT
      # production (only production keeps its still-unmigrated legacy content
      # indexable). No GitHub var needed.
      TF_VAR_seo_noindex: ${{ inputs.environment == 'production' && 'false' || 'true' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.services_sha }}

      - name: Clone content @ pinned SHA
        env:
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          CONTENT_SHA: ${{ needs.resolve.outputs.content_sha }}
        run: |
          git clone --quiet \
            "https://x-access-token:${CONTENT_REPO_TOKEN}@github.com/youproof-org/content.git" \
            "${{ github.workspace }}/content-repo"
          git -C "${{ github.workspace }}/content-repo" checkout --quiet "$CONTENT_SHA"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies (worker subtree only)
        # Worker subtree only — a full-workspace install runs apps/website's
        # check-latex postinstall, which fails on runners without TeX. js-yaml
        # (needed by gen-manifest) is a worker devDep, so it resolves here.
        run: pnpm install --frozen-lockfile --filter @youproof.org/migration-worker...

      - name: Generate manifest from content
        run: pnpm --filter @youproof.org/migration-worker run generate-manifest

      # Hand the content-derived manifest to the quality-gate job so it can verify
      # each migrated redirect's .org target is live (the quality-gate job checks
      # out services, which only has the empty committed stub). Per-run artifact.
      - name: Upload generated manifest (for the quality gate)
        uses: actions/upload-artifact@v4
        with:
          name: worker-manifest-${{ inputs.environment }}
          path: infra/cloudflare/worker/src/manifest.json
          if-no-files-found: error
          retention-days: 1

      - name: Validate manifest
        run: pnpm --filter @youproof.org/migration-worker run validate-manifest

      - name: Typecheck worker
        run: pnpm --filter @youproof.org/migration-worker run typecheck

      - name: Build worker bundle
        run: pnpm --filter @youproof.org/migration-worker run build

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Terraform init (R2 backend, per-environment worker state key)
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.R2_STATE_BUCKET }}" \
            -backend-config="key=cloudflare/worker/${ENVIRONMENT}.tfstate" \
            -backend-config="endpoints={s3=\"https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com\"}" \
            -backend-config="access_key=${AWS_ACCESS_KEY_ID}" \
            -backend-config="secret_key=${AWS_SECRET_ACCESS_KEY}"

      - name: Terraform format check
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform fmt -check -recursive

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform apply -input=false -auto-approve tfplan

      # NOTE: the .hu redirect/X-Robots smoke tests used to run HERE, immediately
      # after apply — which flaked on stale Worker state (the edge could still
      # serve the pre-apply script for a few seconds). They now run at the START
      # of the quality-gate job instead, which is several minutes later (after the
      # website build + upload + purge), by which point the Worker script has
      # propagated. See the "Smoke tests (.hu worker)" step there.

  # Newsletter API worker (youproof.org/api/v1/newsletter/*): its own per-env root
  # (terraform/newsletter/) owning a D1 database, the worker script + bindings, a
  # .org Workers route, and a cron trigger. Independent of the content-site chain
  # (it does NOT gate website/quality-gate) — it only needs the shared zone root
  # applied (for org_zone_id, read via remote state), exactly like website-infra.
  #
  # Ordering matters within the job: the D1 database is created by a TARGETED
  # apply FIRST, migrations run against it via wrangler, THEN the full apply puts
  # the worker script + route live against an already-migrated schema (the worker
  # must never serve before its schema exists). See docs/newsletter.md.
  newsletter-worker:
    needs: [resolve, zone]
    # Skip-tolerant gate (see website-infra): zone is skipped on staging but its
    # state exists, so run when resolve succeeded and zone succeeded or was skipped.
    if: >-
      !cancelled() && needs.resolve.result == 'success' &&
      (needs.zone.result == 'success' || needs.zone.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      TF_WORKDIR: infra/cloudflare/terraform/newsletter
      WORKER_DIR: infra/cloudflare/newsletter-worker
      # Embed the accepted privacy-policy content SHA into the bundle (gen-buildinfo
      # reads CONTENT_SHA directly — no content checkout needed) AND as a readable
      # plain_text binding. Redeploys on every content change because the pipeline
      # re-runs with a new content_sha (repository_dispatch), rebundling the SHA.
      CONTENT_SHA: ${{ needs.resolve.outputs.content_sha }}
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_tfstate_bucket: ${{ vars.R2_STATE_BUCKET }}
      # Same per-env .org host the migration worker 301s to (youproof.org /
      # staging.youproof.org). The route binds to <site_host>/api/v1/newsletter/*.
      TF_VAR_site_host: ${{ vars.REDIRECT_TARGET_HOST }}
      TF_VAR_default_locale: ${{ vars.DEFAULT_LOCALE || 'hu' }}
      TF_VAR_allowed_origins: https://${{ vars.REDIRECT_TARGET_HOST }}
      TF_VAR_content_sha: ${{ needs.resolve.outputs.content_sha }}
      # Brevo/Turnstile: non-secret config as vars, real secrets as env secrets.
      TF_VAR_brevo_sender_email: ${{ vars.BREVO_SENDER_EMAIL }}
      TF_VAR_brevo_sender_name: ${{ vars.BREVO_SENDER_NAME || vars.REDIRECT_TARGET_HOST }}
      TF_VAR_brevo_list_id: ${{ vars.BREVO_LIST_ID }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_brevo_api_key: ${{ secrets.BREVO_API_KEY }}
      TF_VAR_brevo_webhook_token: ${{ secrets.BREVO_WEBHOOK_TOKEN }}
      TF_VAR_turnstile_secret: ${{ secrets.TURNSTILE_SECRET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.services_sha }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies (newsletter-worker subtree only)
        run: pnpm install --frozen-lockfile --filter @youproof.org/newsletter-worker...

      - name: Generate buildinfo (embed content SHA)
        run: pnpm --filter @youproof.org/newsletter-worker run generate-buildinfo

      - name: Typecheck worker
        run: pnpm --filter @youproof.org/newsletter-worker run typecheck

      - name: Unit tests
        run: pnpm --filter @youproof.org/newsletter-worker run test

      - name: Build worker bundle
        run: pnpm --filter @youproof.org/newsletter-worker run build

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Terraform init (R2 backend, per-environment newsletter state key)
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.R2_STATE_BUCKET }}" \
            -backend-config="key=cloudflare/newsletter/${ENVIRONMENT}.tfstate" \
            -backend-config="endpoints={s3=\"https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com\"}" \
            -backend-config="access_key=${AWS_ACCESS_KEY_ID}" \
            -backend-config="secret_key=${AWS_SECRET_ACCESS_KEY}"

      - name: Terraform format check
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform fmt -check -recursive

      # Phase 1 of the two-phase apply: create ONLY the D1 database so migrations
      # can run before the worker goes live. No-op on later deploys. (-target emits
      # an advisory warning; acceptable for this deliberate bootstrap ordering.)
      - name: Terraform apply — D1 database only (targeted)
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform apply -input=false -auto-approve -target=cloudflare_d1_database.newsletter

      - name: Read D1 database id
        id: d1
        working-directory: ${{ env.TF_WORKDIR }}
        # Assign first so a failed read aborts the step (echo would mask the
        # command-substitution exit code and leave an empty id for the sed below).
        run: |
          id="$(terraform output -raw d1_database_id)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # Phase 2: apply versioned SQL migrations to the now-existing DB. wrangler
      # targets by database_id, so inject the TF-created id into the config
      # (placeholder -> real id) before running. Idempotent (tracked in D1).
      - name: Apply D1 migrations (wrangler, remote)
        working-directory: ${{ env.WORKER_DIR }}
        env:
          D1_ID: ${{ steps.d1.outputs.id }}
        run: |
          sed -i "s/00000000-0000-0000-0000-000000000000/${D1_ID}/" wrangler.jsonc
          pnpm exec wrangler d1 migrations apply DB --remote

      # Phase 3: full apply — worker script + bindings + .org route + cron trigger,
      # now against an already-migrated schema.
      - name: Terraform plan (full)
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply (full)
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform apply -input=false -auto-approve tfplan

  # Next.js static export -> upload to the env content bucket -> purge the CDN.
  website:
    # website-infra is listed so its org_zone_id output is readable here (it is
    # already a transitive ancestor via worker, so this adds no ordering).
    needs: [resolve, website-infra, worker]
    # Skip-tolerant gate (see worker): run when the chain up to worker succeeded,
    # regardless of the staging-skipped zone. worker success implies website-infra
    # ran, so its org_zone_id output is available.
    if: >-
      !cancelled() && needs.resolve.result == 'success' &&
      needs.website-infra.result == 'success' && needs.worker.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # The consent banner's policy-page list, for the quality gate to verify those
    # URLs resolve. Passed as an output because the generated file is gitignored and
    # the gate runs on a fresh checkout with no content clone — and because the
    # crawler can never discover these URLs itself (the banner is not in the HTML,
    # so nothing links to them from the markup).
    outputs:
      consent_policy_pages: ${{ steps.consent-pages.outputs.pages }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      SITE_ENV: ${{ inputs.environment }}
      CONTENT_DIR: ${{ github.workspace }}/content-repo/content
      # Default locale baked into the static export (root redirect target, <html
      # lang>, x-default hreflang). Same GitHub Environment var the zone root's
      # apex redirect uses; falls back to the first configured locale if unset.
      DEFAULT_LOCALE: ${{ vars.DEFAULT_LOCALE || 'hu' }}
      # The .org host this environment serves (youproof.org on production,
      # staging.youproof.org on staging). Reuses REDIRECT_TARGET_HOST — the same
      # per-env .org host the migration worker 301s to — so canonical/hreflang/
      # sitemap self-reference this env's host instead of always production.
      SITE_HOST: ${{ vars.REDIRECT_TARGET_HOST }}
      # Legacy (.hu) host the not-yet-migrated chapter stubs link back to
      # (staging.youproof.hu on staging, youproof.hu on production).
      WORKER_DOMAIN: ${{ vars.WORKER_DOMAIN }}
      # Public Cloudflare Turnstile sitekey for the newsletter form. NEXT_PUBLIC_*
      # is inlined into the static export at build time, so it must be present
      # here or the widget never renders. Non-secret (a var); empty just means the
      # form renders without the widget. The newsletter API base is intentionally
      # unset (same-origin relative fetch in production).
      NEXT_PUBLIC_TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
      # GA4 measurement id for THIS environment's property. Production and staging
      # are separate GA4 properties (never one property with filters), so this is
      # one variable name with a different value per GitHub Environment — there is
      # no shared id that could leak staging traffic into production reporting.
      # Public by design (it ships in the client bundle), hence a var, same as the
      # Turnstile sitekey above.
      #
      # EMPTY IS THE KILL SWITCH: with no id, ConsentGate renders nothing at all —
      # no banner, no FAB, no analytics. That is how this code ships safely before
      # the GA4 properties exist, and it is one of the two things keeping
      # production inert until the rewritten cookie policy reaches stable/released
      # (the other is cookiePolicyVersion resolving to 0 from the content).
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      CONTENT_BUCKET: youproof-${{ inputs.environment }}-content
      R2_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com
      # R2 S3 credentials for the content-bucket upload. Dedicated per-environment
      # key scoped to THIS env's content + test-artifacts buckets (an environment
      # secret: the staging Environment holds the staging-bucket key, production
      # holds the production-bucket key). NOT the state creds, which are scoped
      # only to the youproof-tfstate bucket.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_CONTENT_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CONTENT_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Zone id from the website-infra job's output (which reads the zone root's
      # remote-state org_zone_id) — no GitHub variable needed.
      ORG_ZONE_ID: ${{ needs.website-infra.outputs.org_zone_id }}
    steps:
      # Compile LaTeX figures with the SAME TeX Live as local dev (2026) so the
      # generated SVGs are byte-identical. Ubuntu's apt subset ships TL2023, which
      # both crops figures differently (e.g. 220x275 vs 220x178) AND lacks packages
      # such as fontawesome5 — pinning the version + a curated scheme fixes both.
      # scheme-medium is the base (pdflatex, dvisvgm, amsmath/amssymb, CM/LM fonts,
      # inputenc/fontenc/textcomp), but it does NOT include standalone (the figures'
      # documentclass), pgf/tikz, pgfplots, or fontawesome5 — the exact set every
      # figure needs, derived by scanning the content repo's .tex sources. `pgf`
      # covers all the tikz libraries in use (arrows.meta, calc, decorations.*,
      # positioning, shapes.*). Runs BEFORE pnpm install so apps/website's
      # check-latex postinstall and the sync-figures prebuild find pdflatex +
      # dvisvgm on PATH. The action caches the install, so only the first run pays
      # the download cost.
      - name: Set up TeX Live 2026
        uses: TeX-Live/setup-texlive-action@v4
        with:
          version: 2026
          packages: |
            scheme-medium
            standalone
            pgf
            pgfplots
            fontawesome5

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.services_sha }}

      - name: Clone content @ pinned SHA
        env:
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          CONTENT_SHA: ${{ needs.resolve.outputs.content_sha }}
        run: |
          git clone --quiet \
            "https://x-access-token:${CONTENT_REPO_TOKEN}@github.com/youproof-org/content.git" \
            "${{ github.workspace }}/content-repo"
          git -C "${{ github.workspace }}/content-repo" checkout --quiet "$CONTENT_SHA"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies (website subtree)
        run: pnpm install --frozen-lockfile --filter @youproof.org/website...

      # The whole node:test suite over the site's pure modules — consent logic,
      # the knowledge-base URL/graph layer, the chrome state machine. Consent is
      # the part with legal consequences rather than cosmetic ones. Runs before
      # the build so a failure costs a 30-second job, not a deploy.
      - name: Unit tests (website)
        run: pnpm --filter @youproof.org/website run test

      - name: Build static export
        run: pnpm --filter @youproof.org/website build

      # The browser suite runs in THIS job, not its own, because it needs both of the
      # expensive things this job already has: the static export it drives, and the
      # content clone its expected values are derived from (SITE_ENV decides the page
      # set, and the job sets the same value for both). A separate job would have to
      # rebuild all of it — TeX Live, the clone, hundreds of pages. Sitting between the
      # build and the R2 upload is also what makes a failure block the deploy rather
      # than merely report it.
      - name: Install Chromium for the browser tests
        run: pnpm --filter @youproof.org/website exec playwright install --with-deps chromium

      - name: Browser tests (knowledge-base interaction contract)
        run: pnpm --filter @youproof.org/website run test:e2e

      # Traces (retain-on-failure) and the HTML report are the only way to see why
      # a headless run failed on a runner that no longer exists.
      - name: Upload browser-test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ inputs.environment }}
          path: |
            apps/website/playwright-report
            apps/website/test-results
          retention-days: 7
          if-no-files-found: ignore

      # Read AFTER the build, so this is the list the deployed bundle actually
      # links. Absent file => the consent feature is off in this build; the gate
      # treats an empty list as "nothing to verify".
      - name: Collect consent policy pages
        id: consent-pages
        run: |
          f=apps/website/.generated/consent-policy.json
          if [ -f "$f" ]; then
            echo "pages=$(jq -c '.pages // []' "$f")" >> "$GITHUB_OUTPUT"
          else
            echo "pages=[]" >> "$GITHUB_OUTPUT"
          fi

      # Upload the export to R2 via the S3 API. --delete removes stale objects so
      # the bucket exactly mirrors out/. aws-cli (preinstalled on the runner)
      # infers content types from file extensions (.html -> text/html), which is
      # what the CDN serves.
      - name: Upload to R2 content bucket
        run: |
          aws s3 sync apps/website/out/ "s3://${CONTENT_BUCKET}/" \
            --delete \
            --endpoint-url "${R2_ENDPOINT}"

      # Cache-bust scoped to THIS environment's hostname. staging and production
      # share one zone (youproof.org), so `purge_everything` would wipe the other
      # environment's cache too; purge-by-hostname (available on all plans since
      # 2025-04) invalidates only this env's host. Zone id comes from the
      # website-infra job output (the zone root's org_zone_id remote-state value).
      - name: Purge CDN cache (this environment's host only)
        run: |
          curl -sfS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${ORG_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg h "$SITE_HOST" '{hosts: [$h]}')"

  # Post-deploy quality gate against the LIVE .org host. Crawler-based: the smoke
  # suite is skipped here (SKIP_SMOKE=1) because it asserts the .hu migration
  # worker's 301/410 redirect semantics, which don't apply to the .org static
  # site — see the "smoke-suite-on-.org decision" note below and in the report.
  # The .hu smoke tests still run in the `worker` job. The gate writes the
  # contract JSON artifact keyed by the (services_sha, content_sha) pair.
  quality-gate:
    needs: [resolve, website]
    # Skip-tolerant gate (see worker): run when website succeeded, regardless of
    # the staging-skipped zone.
    if: >-
      !cancelled() && needs.resolve.result == 'success' &&
      needs.website.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      SERVICES_SHA: ${{ needs.resolve.outputs.services_sha }}
      CONTENT_SHA: ${{ needs.resolve.outputs.content_sha }}
      # WORKER_DOMAIN is the smoke config's "host under test" — here the .org host.
      WORKER_DOMAIN: ${{ inputs.environment == 'production' && 'youproof.org' || 'staging.youproof.org' }}
      # Empty legacy/redirect hosts => post-migration mode (no .hu redirect checks).
      LEGACY_PROXY_HOST: ""
      REDIRECT_TARGET_HOST: ""
      SKIP_SMOKE: "1"
      # Consent policy pages from the website job. SKIP_SMOKE drops the .hu redirect
      # suites, but these .org consent cases are still appended to the smoke suite,
      # so a policy page the banner links to but the site does not serve fails the
      # gate. Empty when the consent feature is off in this build.
      CONSENT_POLICY_PAGES: ${{ needs.website.outputs.consent_policy_pages }}
      # Absolute path: the gate step runs with cwd = the smoke-tests package dir
      # (pnpm --filter), but the upload step runs from the repo root. An absolute
      # path makes both agree on where the report lives.
      REPORT_OUT: ${{ github.workspace }}/quality-gate-report.json
      # The content-derived manifest from the worker job (downloaded below). The
      # gate verifies each migrated redirect's .org target returns 200.
      MANIFEST_PATH: ${{ github.workspace }}/worker-manifest/manifest.json
      ARTIFACTS_BUCKET: youproof-${{ inputs.environment }}-test-artifacts
      R2_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com
      # Dedicated per-environment R2 key (environment secret), scoped to this
      # env's content + test-artifacts buckets — not the state-bucket creds.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_CONTENT_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CONTENT_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.services_sha }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies (smoke-tests subtree)
        run: pnpm install --frozen-lockfile --filter @youproof.org/smoke-tests...

      # The manifest the worker job generated from content — its values are the
      # .org targets the gate verifies are live. Lands at MANIFEST_PATH.
      - name: Download generated manifest (migrated-target check)
        uses: actions/download-artifact@v4
        with:
          name: worker-manifest-${{ inputs.environment }}
          path: ${{ github.workspace }}/worker-manifest

      # .hu migration-Worker smoke tests (moved here from the worker job to avoid
      # stale-Worker-state flakiness — by now the script has propagated). Runs
      # against the .hu host, so the .hu env vars OVERRIDE the job-level .org ones.
      # Uses the just-downloaded generated manifest (MANIFEST_PATH) so the
      # migrated-path 301 assertions run against real entries. Staging is always
      # Worker-fronted; production only after cut-over.
      - name: Smoke tests (.hu worker)
        if: >-
          inputs.environment == 'staging' ||
          (inputs.environment == 'production' && vars.PRODUCTION_CUTOVER == 'true')
        env:
          WORKER_DOMAIN: ${{ vars.WORKER_DOMAIN }}
          REDIRECT_TARGET_HOST: ${{ vars.REDIRECT_TARGET_HOST }}
          LEGACY_PROXY_HOST: ${{ vars.LEGACY_PROXY_HOST }}
        run: node --test "tools/smoke-tests/tests/*.test.mjs"

      - name: Run quality gate
        id: gate
        continue-on-error: true
        run: pnpm --filter @youproof.org/smoke-tests quality-gate

      # Upload the report even when the gate failed (if: always()) — the PR gate
      # reads overall === "pass" from it, and a failing prod report is what the
      # rollback lookup skips over.
      - name: Upload report to test-artifacts bucket
        if: always()
        run: |
          KEY="reports/${SERVICES_SHA}__${CONTENT_SHA}.json"
          aws s3 cp "${REPORT_OUT}" "s3://${ARTIFACTS_BUCKET}/${KEY}" \
            --content-type application/json --endpoint-url "${R2_ENDPOINT}"
          aws s3 cp "${REPORT_OUT}" "s3://${ARTIFACTS_BUCKET}/reports/latest.json" \
            --content-type application/json --endpoint-url "${R2_ENDPOINT}"
          echo "Uploaded ${KEY} (+ reports/latest.json) to ${ARTIFACTS_BUCKET}."

      # Retention: keep the newest 30 pair-reports per environment; delete older
      # ones (never reports/latest.json). Best-effort — a prune failure must not
      # fail the deploy (continue-on-error), and it also bounds how far back the
      # rollback lookup can find a last-known-good pair.
      - name: Prune old test artifacts (keep newest 30)
        if: always()
        continue-on-error: true
        env:
          KEEP: "30"
        run: |
          # Report object keys, oldest first, excluding the latest.json pointer.
          mapfile -t keys < <(
            aws s3api list-objects-v2 --bucket "$ARTIFACTS_BUCKET" --prefix "reports/" \
              --endpoint-url "$R2_ENDPOINT" \
              --query "sort_by(Contents,&LastModified)[].Key" --output text 2>/dev/null \
              | tr '\t' '\n' | grep -v '^reports/latest\.json$' || true
          )
          total=${#keys[@]}
          if [ "$total" -le "$KEEP" ]; then
            echo "Retention: $total report(s) ≤ $KEEP — nothing to prune."
            exit 0
          fi
          prune=$(( total - KEEP ))
          echo "Retention: pruning oldest $prune of $total report(s) (keeping newest $KEEP)."
          for key in "${keys[@]:0:$prune}"; do
            aws s3 rm "s3://${ARTIFACTS_BUCKET}/${key}" --endpoint-url "$R2_ENDPOINT"
          done

      - name: Distinct error when a ROLLBACK's own gate fails
        if: steps.gate.outcome == 'failure' && inputs.is_rollback == true
        run: |
          echo "::error title=Rollback quality gate FAILED::The rollback redeploy at the last known-good pair ALSO failed its production quality gate. No further automatic rollback will run — manual intervention required."

      - name: Fail the job if the gate failed
        if: steps.gate.outcome == 'failure'
        run: exit 1

  # Fully-automatic, forward-only rollback trigger. Only on a PRODUCTION deploy
  # whose gate failed, and never during a rollback (is_rollback == true) so a
  # failing rollback can't loop. Dispatches rollback.yml at runtime (dynamic
  # `gh workflow run`, not a static `uses:` — avoids a reusable-workflow cycle).
  rollback-dispatch:
    needs: [resolve, quality-gate]
    if: >-
      always() && inputs.environment == 'production' && inputs.is_rollback == false &&
      needs.quality-gate.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Trigger rollback to last known-good pair
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_SERVICES_SHA: ${{ needs.resolve.outputs.services_sha }}
          FAILED_CONTENT_SHA: ${{ needs.resolve.outputs.content_sha }}
        run: |
          echo "::warning title=Production gate failed::Dispatching automatic rollback (excluding failed pair ${FAILED_SERVICES_SHA}__${FAILED_CONTENT_SHA})."
          gh workflow run rollback.yml \
            --ref stable/production \
            -f failed_services_sha="${FAILED_SERVICES_SHA}" \
            -f failed_content_sha="${FAILED_CONTENT_SHA}"

  # Tag a new production release. After a SUCCESSFUL production gate, if
  # apps/website/package.json's version changed vs the previous production commit
  # (HEAD^1 — the first parent of the release merge commit, i.e. the last
  # release), create an annotated vX.Y.Z tag on the RELEASED commit
  # (resolve.services_sha = the stable/production tip, NOT the stable/staging
  # source, which is the merge's second parent). Never runs on rollbacks.
  #
  # Independent of rollback-dispatch, which keys ONLY on a FAILED gate — so a tag
  # failure can never trigger a rollback. But a warranted tag that fails to create
  # DOES fail this job (red run) + emits an ::error::, so a missing release tag is
  # loudly surfaced for manual intervention rather than a silent annotation.
  tag-release:
    needs: [resolve, quality-gate]
    if: >-
      always() && inputs.environment == 'production' && inputs.is_rollback == false &&
      needs.quality-gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.services_sha }}
          # Full history so we can diff package.json at HEAD vs HEAD^1 (last release).
          fetch-depth: 0
      - name: Tag release when the website version changed
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.services_sha }}
        run: |
          set -uo pipefail
          PKG="apps/website/package.json"

          current="$(node -p "require('./${PKG}').version" 2>/dev/null || true)"
          if [ -z "$current" ]; then
            echo "::error title=Release tag failed — manual intervention required::Could not read a version from ${PKG} at the released commit."
            exit 1
          fi

          # Previous production release = first parent of the release merge commit.
          # Empty when unreadable (e.g. the first-ever release) -> treated as changed.
          previous=""
          if git show "HEAD^1:${PKG}" > /tmp/prev-pkg.json 2>/dev/null; then
            previous="$(node -p "require('/tmp/prev-pkg.json').version" 2>/dev/null || true)"
          fi

          echo "website version: previous='${previous:-<none>}' current='${current}'"
          if [ "$current" = "$previous" ]; then
            echo "Version unchanged (${current}) — no release tag created."
            exit 0
          fi

          tag="v${current}"
          echo "Version changed '${previous:-<none>}' -> '${current}'; tagging released commit ${RELEASE_SHA} as ${tag}."

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error title=Release tag failed — manual intervention required::Tag ${tag} already exists. No rollback dispatched; resolve the tag manually."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git tag -a "${tag}" "${RELEASE_SHA}" -m "Release ${tag}"; then
            echo "::error title=Release tag failed — manual intervention required::Could not create annotated tag ${tag}. No rollback dispatched."
            exit 1
          fi
          if ! git push origin "refs/tags/${tag}"; then
            echo "::error title=Release tag failed — manual intervention required::Could not push tag ${tag} (tag protection or network?). No rollback dispatched."
            exit 1
          fi
          echo "Created and pushed release tag ${tag}."
