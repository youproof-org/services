# Generic Cloudflare infrastructure pipeline.
#
# Covers the two Terraform roots under infra/cloudflare/terraform/, which are
# three independent applies:
#   - zone/            single shared state (cloudflare/zone.tfstate) — the zone
#   - worker/ (staging)   per-env state (cloudflare/worker/staging.tfstate)
#   - worker/ (production) per-env state (cloudflare/worker/production.tfstate)
#
# Environment is derived from the branch (never chosen manually) and secrets are
# scoped via GitHub Environments, so a staging push can never apply production
# and vice versa. Structured to grow (e.g. a future `website` job) without
# renaming anything.
name: deploy-to-cloudflare

on:
  push:
    branches:
      - stable/staging
      - stable/production
    paths:
      - "infra/cloudflare/**"
      - ".github/workflows/deploy-to-cloudflare.yml"
  pull_request:
    paths:
      - "infra/cloudflare/**"
      - ".github/workflows/deploy-to-cloudflare.yml"

concurrency:
  group: deploy-to-cloudflare-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Detect which root changed so we only plan/apply what's relevant.
  changes:
    runs-on: ubuntu-latest
    outputs:
      zone: ${{ steps.filter.outputs.zone }}
      worker: ${{ steps.filter.outputs.worker }}
      zone_src: ${{ steps.filter.outputs.zone_src }}
      not_zone: ${{ steps.filter.outputs.not_zone }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            zone:
              - 'infra/cloudflare/terraform/zone/**'
              - '.github/workflows/deploy-to-cloudflare.yml'
            worker:
              - 'infra/cloudflare/terraform/worker/**'
              - 'infra/cloudflare/worker/**'
              - '.github/workflows/deploy-to-cloudflare.yml'
            # Guard inputs (see the `guard` job): zone_src = zone sources only
            # (excludes the workflow file, so a workflow-only PR isn't flagged);
            # not_zone = any changed file outside the zone root. dorny sets
            # picomatch dot:true, so `**` also matches dotfiles / dot-dirs.
            zone_src:
              - 'infra/cloudflare/terraform/zone/**'
            not_zone:
              - '**'
              - '!infra/cloudflare/terraform/zone/**'

  # Zone PRs must be "pure": a PR touching the zone root may touch NOTHING else.
  # Zone changes apply only at the production merge and are never staged, so keeping
  # them isolated makes that production apply clean, reviewable, and easy to roll
  # back. Runs on every PR (so `guard` is a stable required status check) and fails
  # only when the zone root is changed alongside anything else.
  guard:
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Zone PRs must contain only zone changes
        if: needs.changes.outputs.zone_src == 'true' && needs.changes.outputs.not_zone == 'true'
        run: |
          echo "::error::This PR changes terraform/zone/** together with other files. Zone changes apply only at the production merge and are never staged, so a zone PR must contain ONLY terraform/zone/** — move anything else (worker, docs, unrelated files) into a separate PR."
          exit 1

  # Shared zone + nothing else. Applied only from the production branch (it owns
  # account-level infra shared by both environments); plan-only on PRs.
  zone:
    needs: changes
    if: >-
      needs.changes.outputs.zone == 'true' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/stable/production')
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_WORKDIR: infra/cloudflare/terraform/zone
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Terraform init (R2 backend, zone state key)
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.R2_STATE_BUCKET }}" \
            -backend-config="key=cloudflare/zone.tfstate" \
            -backend-config="endpoints={s3=\"https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com\"}" \
            -backend-config="access_key=${AWS_ACCESS_KEY_ID}" \
            -backend-config="secret_key=${AWS_SECRET_ACCESS_KEY}"

      - name: Terraform format check
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform fmt -check -recursive

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: github.event_name == 'push'
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform apply -input=false -auto-approve tfplan

  # Per-environment Worker deploy. One matrix definition, but each entry only
  # runs for its matching branch (or, on PRs, staging only as the review gate).
  worker:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        env: [staging, production]
    if: >-
      needs.changes.outputs.worker == 'true' && (
        (github.event_name == 'pull_request' && matrix.env == 'staging') ||
        (github.ref == 'refs/heads/stable/staging' && matrix.env == 'staging') ||
        (github.ref == 'refs/heads/stable/production' && matrix.env == 'production')
      )
    runs-on: ubuntu-latest
    # Binds to the GitHub Environment so only that environment's secrets/vars are
    # visible — production values are never available to the staging run.
    environment: ${{ matrix.env }}
    env:
      ENVIRONMENT: ${{ matrix.env }}
      TF_WORKDIR: infra/cloudflare/terraform/worker
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Terraform variables from environment-scoped GitHub vars/secrets (no
      # -var-file in CI, so nothing per-environment is committed and values never
      # cross over). The committed environments/*.tfvars.example are local-only.
      TF_VAR_environment: ${{ matrix.env }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # The zone ID is read from the zone root's remote state (data.tf), not
      # passed in — the worker job only needs the state bucket name to find it.
      TF_VAR_tfstate_bucket: ${{ vars.R2_STATE_BUCKET }}
      TF_VAR_worker_domain: ${{ vars.WORKER_DOMAIN }}
      TF_VAR_redirect_target_host: ${{ vars.REDIRECT_TARGET_HOST }}
      TF_VAR_legacy_proxy_host: ${{ vars.LEGACY_PROXY_HOST }}
      TF_VAR_rackhost_server_ip: ${{ vars.RACKHOST_SERVER_IP }}
      # Production cut-over switch. Ignored for staging. Set the PRODUCTION_CUTOVER
      # variable on the production GitHub Environment to 'true' at cut-over;
      # defaults to false everywhere else.
      TF_VAR_production_cutover: ${{ vars.PRODUCTION_CUTOVER || 'false' }}
      # Long-lived access token, not a true secret: a GitHub Environment
      # *variable*, so it is NOT log-masked — no step may echo it.
      TF_VAR_legacy_guard_value: ${{ vars.LEGACY_GUARD_VALUE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate manifest
        run: pnpm --filter @youproof.org/migration-worker run validate-manifest

      - name: Typecheck worker
        run: pnpm --filter @youproof.org/migration-worker run typecheck

      - name: Build worker bundle
        run: pnpm --filter @youproof.org/migration-worker run build

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Terraform init (R2 backend, per-environment state key)
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.R2_STATE_BUCKET }}" \
            -backend-config="key=cloudflare/worker/${ENVIRONMENT}.tfstate" \
            -backend-config="endpoints={s3=\"https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com\"}" \
            -backend-config="access_key=${AWS_ACCESS_KEY_ID}" \
            -backend-config="secret_key=${AWS_SECRET_ACCESS_KEY}"

      - name: Terraform format check
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform fmt -check -recursive

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKDIR }}
        # All variables come from TF_VAR_* env vars above; no -var-file in CI.
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: github.event_name == 'push'
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform apply -input=false -auto-approve tfplan
