# Cloudflare pipeline entrypoint (router + PR review gates).
#
# Two responsibilities:
#   1. PULL REQUESTS -> plan-only review gates (Terraform fmt/plan for each root,
#      worker build). No apply, no site build. Preserves the pre-YP-120 behaviour
#      of the zone/worker plan gates and adds org-zone + cdn plans.
#   2. PUSH to a stable branch, OR a content repository_dispatch -> a full deploy
#      by calling the reusable ./.github/workflows/deploy.yml.
#
# IMPORTANT CHANGE (YP-120): apply now lives entirely in deploy.yml. The old
# in-place push-apply of the zone/worker roots is superseded — a push routes to
# the reusable deploy, which also regenerates the worker manifest from content,
# deploys the .org CDN + site, and runs the post-deploy quality gate. The
# zone/worker jobs here are therefore plan-only, PR-only review gates.
#
# Deploy version mapping (always the LATEST of both sides — the reusable workflow
# checks out branch tips):
#   push stable/staging     | dispatch content-draft-updated -> STAGING    (stable/staging + draft)
#   push stable/production   | dispatch content-released       -> PRODUCTION (stable/production + stable/released)
name: deploy-to-cloudflare

on:
  push:
    # No paths filter on push: a promotion merge to a stable branch must ALWAYS
    # deploy (the "automatic on promotion" invariant), even if its diff only
    # touches unlisted paths (e.g. pnpm-lock.yaml, packages/**, a dependency
    # bump) that can still change the built site. Applies are idempotent, so a
    # redundant deploy is a safe no-op. PRs keep a paths filter (below) to scope
    # the plan-only review gates.
    branches:
      - stable/staging
      - stable/production
  repository_dispatch:
    types: [content-draft-updated, content-released]
  pull_request:
    paths:
      - "infra/cloudflare/**"
      - "apps/website/**"
      - "tools/smoke-tests/**"
      - ".github/workflows/deploy-to-cloudflare.yml"
      - ".github/workflows/deploy.yml"

concurrency:
  # ${{ github.event.action }} disambiguates the two dispatch types (which share
  # github.ref); pushes/PRs key on the ref.
  group: deploy-to-cloudflare-${{ github.ref }}-${{ github.event.action }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ DEPLOY --
  # Map trigger -> (environment, services_ref, content_ref), then call the
  # reusable full-site deploy. Only for push (to a stable branch) or a content
  # dispatch; PRs skip this and hit the plan gates below.
  route:
    if: github.event_name == 'push' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.r.outputs.environment }}
      services_ref: ${{ steps.r.outputs.services_ref }}
      content_ref: ${{ steps.r.outputs.content_ref }}
    steps:
      - id: r
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTION: ${{ github.event.action }}
        run: |
          if { [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/stable/production" ]; } || \
             { [ "$EVENT" = "repository_dispatch" ] && [ "$ACTION" = "content-released" ]; }; then
            {
              echo "environment=production"
              echo "services_ref=stable/production"
              echo "content_ref=stable/released"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "environment=staging"
              echo "services_ref=stable/staging"
              echo "content_ref=draft"
            } >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: route
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ needs.route.outputs.environment }}
      services_ref: ${{ needs.route.outputs.services_ref }}
      content_ref: ${{ needs.route.outputs.content_ref }}
      is_rollback: false
    secrets: inherit

  # --------------------------------------------------------------- PR GATES ---
  # Detect which Terraform root a PR touched, so we only plan what's relevant.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      zone: ${{ steps.filter.outputs.zone }}
      orgzone: ${{ steps.filter.outputs.orgzone }}
      cdn: ${{ steps.filter.outputs.cdn }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            zone:
              - 'infra/cloudflare/terraform/zone/**'
            orgzone:
              - 'infra/cloudflare/terraform/org-zone/**'
            cdn:
              - 'infra/cloudflare/terraform/cdn/**'
            worker:
              - 'infra/cloudflare/terraform/worker/**'
              - 'infra/cloudflare/worker/**'
              - 'tools/smoke-tests/**'

  # Zone/org-zone PRs must be "pure": a PR touching a shared-zone root may touch
  # NOTHING else, so a zone change is never batched with worker/cdn/other changes.
  # Lists the PR's files via the REST API (authoritative) and fails only when both
  # a shared-zone path and a non-zone path are present.
  guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Shared-zone PRs must contain only that root's changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" --jq '.[].filename')
          zone=$(printf '%s\n' "$files" | grep -E '^infra/cloudflare/terraform/(zone|org-zone)/' || true)
          other=$(printf '%s\n' "$files" | grep -vE '^infra/cloudflare/terraform/(zone|org-zone)/' || true)
          if [ -n "$zone" ] && [ -n "$other" ]; then
            echo "::error title=Mixed zone PR::A shared-zone PR (zone/ or org-zone/) must contain ONLY that root — move these out of the PR:"
            printf '%s\n' "$other"
            exit 1
          fi
          echo "Zone-only or no shared-zone changes — OK."

  zone-plan:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.zone == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_WORKDIR: infra/cloudflare/terraform/zone
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
      - name: Terraform init (R2 backend, zone state key)
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.R2_STATE_BUCKET }}" \
            -backend-config="key=cloudflare/zone.tfstate" \
            -backend-config="endpoints={s3=\"https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com\"}" \
            -backend-config="access_key=${AWS_ACCESS_KEY_ID}" \
            -backend-config="secret_key=${AWS_SECRET_ACCESS_KEY}"
      - name: Terraform format check
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform fmt -check -recursive
      - name: Terraform plan
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform plan -input=false

  org-zone-plan:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.orgzone == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_WORKDIR: infra/cloudflare/terraform/org-zone
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
      - name: Terraform init (R2 backend, org-zone state key)
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.R2_STATE_BUCKET }}" \
            -backend-config="key=cloudflare/org-zone.tfstate" \
            -backend-config="endpoints={s3=\"https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com\"}" \
            -backend-config="access_key=${AWS_ACCESS_KEY_ID}" \
            -backend-config="secret_key=${AWS_SECRET_ACCESS_KEY}"
      - name: Terraform format check
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform fmt -check -recursive
      - name: Terraform plan
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform plan -input=false

  cdn-plan:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.cdn == 'true'
    runs-on: ubuntu-latest
    # Plan against staging on a PR (mirrors the worker plan's default env).
    environment: staging
    env:
      ENVIRONMENT: staging
      TF_WORKDIR: infra/cloudflare/terraform/cdn
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_environment: staging
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_tfstate_bucket: ${{ vars.R2_STATE_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
      - name: Terraform init (R2 backend, cdn staging state key)
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.R2_STATE_BUCKET }}" \
            -backend-config="key=cloudflare/cdn/staging.tfstate" \
            -backend-config="endpoints={s3=\"https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com\"}" \
            -backend-config="access_key=${AWS_ACCESS_KEY_ID}" \
            -backend-config="secret_key=${AWS_SECRET_ACCESS_KEY}"
      - name: Terraform format check
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform fmt -check -recursive
      - name: Terraform plan
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform plan -input=false

  worker-plan:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    # Plan against staging on a PR. Uses the COMMITTED manifest (no content
    # checkout on a PR) — manifest generation happens only in the real deploy.
    environment: staging
    env:
      ENVIRONMENT: staging
      TF_WORKDIR: infra/cloudflare/terraform/worker
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_environment: staging
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_tfstate_bucket: ${{ vars.R2_STATE_BUCKET }}
      TF_VAR_worker_domain: ${{ vars.WORKER_DOMAIN }}
      TF_VAR_redirect_target_host: ${{ vars.REDIRECT_TARGET_HOST }}
      TF_VAR_legacy_proxy_host: ${{ vars.LEGACY_PROXY_HOST }}
      TF_VAR_rackhost_server_ip: ${{ vars.RACKHOST_SERVER_IP }}
      TF_VAR_production_cutover: ${{ vars.PRODUCTION_CUTOVER || 'false' }}
      TF_VAR_legacy_guard_value: ${{ vars.LEGACY_GUARD_VALUE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install dependencies (worker subtree only)
        run: pnpm install --frozen-lockfile --filter @youproof.org/migration-worker...
      - name: Validate manifest
        run: pnpm --filter @youproof.org/migration-worker run validate-manifest
      - name: Typecheck worker
        run: pnpm --filter @youproof.org/migration-worker run typecheck
      - name: Build worker bundle
        run: pnpm --filter @youproof.org/migration-worker run build
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
      - name: Terraform init (R2 backend, worker staging state key)
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.R2_STATE_BUCKET }}" \
            -backend-config="key=cloudflare/worker/staging.tfstate" \
            -backend-config="endpoints={s3=\"https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com\"}" \
            -backend-config="access_key=${AWS_ACCESS_KEY_ID}" \
            -backend-config="secret_key=${AWS_SECRET_ACCESS_KEY}"
      - name: Terraform format check
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform fmt -check -recursive
      - name: Terraform plan
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform plan -input=false
